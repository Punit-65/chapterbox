<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ChapterBox — split long lectures into chapter videos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff4e45'/><path d='M40 30v40l32-20z' fill='white'/></svg>">
<style>
:root{--bg:#0f0f0f;--panel:#181818;--panel2:#222;--line:#2f2f2f;--text:#f1f1f1;--muted:#a3a3a3;--accent:#ff4e45;--good:#2ecc71;--active:#263238;--warn:#ffb74d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,a.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,a.btn:hover{background:#2d2d2d}
button:disabled{opacity:.45;cursor:default}
button.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover,a.btn.primary:hover{filter:brightness(1.08)}
button.danger{color:#ff8a80}
button.danger-fill{background:#c62828;border-color:#c62828;color:#fff;font-weight:600}
button.small{padding:4px 9px;font-size:12px}
input,textarea{font:inherit;background:#121212;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus{outline:2px solid #3d6bff55;border-color:#3d6bff}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
code{background:#262626;padding:1px 6px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px;margin-right:6px}
.logo span{color:var(--accent)}
.spacer{flex:1}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 55px)}
aside{border-right:1px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 55px);position:sticky;top:55px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 4px 10px}
.lib-item{display:flex;gap:10px;padding:8px;border-radius:10px;cursor:pointer;align-items:flex-start}
.lib-item:hover{background:var(--panel)}
.lib-item.active{background:var(--active)}
.lib-thumb{width:96px;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#4a1f1d,#1d2b3d)}
.lib-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lib-title{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:4px;background:#333;border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.green>i{background:var(--good)}
main{padding:16px;min-width:0}
.setup{background:#1b1f2a;border:1px solid #33415c;border-radius:12px;padding:16px 18px;margin-bottom:16px}
.setup.warn{background:#2a2216;border-color:#5c4a2a}
.setup h3{margin:0 0 6px;font-size:16px}
.setup p{margin:6px 0}
.setup ol{margin:8px 0;padding-left:20px}
.setup li{margin:4px 0}
.setup textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#cfd8dc;margin-top:8px}
.pill{display:inline-block;background:#3d6bff;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.empty{max-width:560px;margin:50px auto;text-align:center}
.empty h1{font-size:26px;margin:0 0 8px}
.steps{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px 14px 34px;margin:20px 0}
.steps li{margin:6px 0}
.titlebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.titlebar h2{margin:0;font-size:20px;flex:1;min-width:200px;cursor:text}
.titlebar h2:hover{text-decoration:underline dotted #666}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.playerbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.playerwrap{background:#000;border-radius:12px;overflow:hidden}
.cbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#141414}
.cbar[hidden]{display:none}
.cbar button{background:transparent;border:0;padding:5px 8px;font-size:15px;line-height:1}
.cbar button:hover{background:#2a2a2a}
.ctime{font-variant-numeric:tabular-nums;font-size:13px;color:#ddd;white-space:nowrap}
.cprog{flex:1;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none;margin:0 6px}
.ctrack{position:relative;width:100%;height:5px;background:#3a3a3a;border-radius:3px}
.cprog:hover .ctrack{height:7px}
.cfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:3px}
#cSpeed{font-size:13px;font-weight:700;min-width:46px}
.playerwrap:fullscreen{display:flex;flex-direction:column;border-radius:0}
.playerwrap:fullscreen .playerbox{flex:1;aspect-ratio:auto}
.playerbox iframe,#player{position:absolute;inset:0;width:100%;height:100%;border:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background-color:#000;background-size:cover;background-position:center}
.overlay p{max-width:540px;margin:0}
.pnote{font-size:12px;color:var(--warn);margin-top:8px}
.now{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.now-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.now h3{margin:0;font-size:17px}
.now .meta{color:var(--muted);font-size:12px;margin-top:2px}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.chk input{width:auto}
.playlist{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:71px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.pl-head{padding:12px 14px;border-bottom:1px solid var(--line)}
.pl-head b{font-size:15px}
.pl-list{overflow:auto;padding:6px}
.ch{display:flex;gap:10px;padding:6px;border-radius:10px;cursor:pointer;align-items:flex-start;position:relative}
.ch:hover{background:#262626}
.ch.active{background:var(--active)}
.ch .num{width:20px;text-align:center;color:var(--muted);font-size:12px;padding-top:24px;flex:none}
.thumb{position:relative;width:132px;flex:none;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#4a1f1d,#1d2b3d)}
.thumb img{width:100%;height:100%;object-fit:cover;filter:brightness(.8);display:block}
.thumb .badge{position:absolute;right:4px;bottom:4px;background:#000c;color:#fff;font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px}
.thumb .tag{position:absolute;left:4px;top:4px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.thumb .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff3}
.thumb .prog i{display:block;height:100%;background:var(--accent)}
.ch .info{min-width:0;flex:1;padding-right:24px}
.ch .t{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch .s{font-size:12px;color:var(--muted);margin-top:3px}
.ch.done .t{color:#9be7b5}
.donebtn{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;border:1px solid #555;background:transparent;padding:0;font-size:12px;line-height:20px;color:transparent;justify-content:center}
.ch.done .donebtn{background:var(--good);border-color:var(--good);color:#06240f}
.donebtn:hover{border-color:var(--good);color:var(--good)}
.modal-bg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 4px;font-size:19px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:none}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.notes textarea{min-height:90px;margin-top:6px}
kbd{background:#2a2a2a;border:1px solid #444;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
@media (max-width:1100px){.watch{grid-template-columns:1fr}.playlist{position:static;max-height:none}}
@media (max-width:760px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto}aside h3{display:none}.lib-item{flex:none;width:240px}header .hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Chapter<span>Box</span></div>
  <span class="muted hide-sm">turn long lectures into bite-size videos</span>
  <div class="spacer"></div>
  <button class="primary" id="addBtn">+ Add video</button>
  <button id="exportBtn" title="Download a backup of everything">Export</button>
  <button id="importBtn" title="Restore from a backup file">Import</button>
  <button id="helpBtn" title="Help">?</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</header>

<div class="layout">
  <aside id="library"></aside>
  <main>
    <div id="banner"></div>
    <div id="emptyView" class="empty"></div>
    <div id="watchView" hidden>
      <div class="titlebar" id="titlebar"></div>
      <div class="watch">
        <div>
          <div class="playerwrap" id="playerwrap">
            <div class="playerbox" id="playerbox"><div id="player"></div></div>
            <div class="cbar" id="cbar" hidden>
              <button id="cPlay" title="Play / pause (Space)">▶</button>
              <span class="ctime" id="cTime">0:00 / 0:00</span>
              <div class="cprog" id="cProg" title="This chapter only"><div class="ctrack"><div class="cfill" id="cFill"></div></div></div>
              <button id="cSpeed" title="Playback speed">1×</button>
              <button id="cMute" title="Mute / unmute">🔊</button>
              <button id="cFs" title="Full screen">⛶</button>
            </div>
          </div>
          <div id="playerNote"></div>
          <div class="now" id="now"></div>
        </div>
        <div class="playlist" id="playlist"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ================= storage =================
const KEY = 'chapterbox.v1';
let store = loadStore();
function loadStore(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.videos)){ s.settings = Object.assign({autoNext:true}, s.settings); return s; }
  }catch(e){}
  return {videos:[], settings:{autoNext:true}, currentId:null};
}
let saveWarned = false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ if(!saveWarned){ toast('Could not save: browser storage is blocked here'); saveWarned = true; } }
}

// ================= where are we running? =================
const IS_FILE = location.protocol === 'file:';
const IS_LOCALHOST = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const IS_FRAMED = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
// ytMode: loading → api (full player) | plain (simple embed) | blocked (preview) ; file = opened by double-click
let ytMode = IS_FILE ? 'file' : 'loading';

// ================= helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(sec){
  sec = Math.max(0, Math.floor(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function fmtLen(sec){
  sec = Math.round(sec||0); const h = Math.floor(sec/3600), m = Math.round(sec%3600/60);
  return h ? `${h}h ${m}m` : `${Math.max(1,m)}m`;
}
function toSec(str){
  if(str == null) return null; str = String(str).trim(); if(!str) return null;
  if(/^\d+(\.\d+)?$/.test(str)) return Math.round(parseFloat(str)*60); // plain number = minutes
  const p = str.split(':').map(Number); if(p.some(isNaN) || p.length > 3) return null;
  return p.reduce((a,b) => a*60 + b, 0);
}
function ytId(s){
  s = (s||'').trim(); if(/^[\w-]{11}$/.test(s)) return s;
  try{
    const u = new URL(/^https?:\/\//.test(s) ? s : 'https://' + s);
    if(u.hostname.includes('youtu.be')) return u.pathname.slice(1, 12) || null;
    if(u.searchParams.get('v')) return u.searchParams.get('v').slice(0, 11);
    const m = u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/); if(m) return m[2];
  }catch(e){}
  return null;
}
function urlStart(s){
  try{
    const u = new URL(/^https?:\/\//.test(s) ? s : 'https://' + s); const t = u.searchParams.get('t');
    if(t){ const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/); if(m) return (+(m[1]||0))*3600 + (+(m[2]||0))*60 + (+(m[3]||0)); }
  }catch(e){}
  return 0;
}
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const watchUrl = (id, t) => `https://www.youtube.com/watch?v=${id}${t ? '&t=' + Math.floor(t) + 's' : ''}`;
const fileName = () => decodeURIComponent(location.pathname.split('/').pop() || 'chapterbox.html');

// Parse chapters. Works with description lines ("54:00 Problem 8", "Problem 8 - 54:00")
// and with YouTube's chapter panel copy (title on one line, time on the next).
function parseChapters(text){
  const out = []; let lastText = '';
  for(const raw of (text||'').split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    const m = line.match(/(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?!\d)/);
    if(!m){ lastText = line; continue; }
    const sec = (+(m[1]||0))*3600 + (+m[2])*60 + (+m[3]);
    let title = (line.slice(0, m.index) + ' ' + line.slice(m.index + m[0].length))
      .replace(/^[\s\-–—|:.,)\]•*>]+/, '').replace(/[\s\-–—|:(\[•*]+$/, '').replace(/\s+/g, ' ').trim();
    if(!title && lastText) title = lastText;
    lastText = '';
    out.push({start: sec, title});
  }
  out.sort((a,b) => a.start - b.start);
  const dedup = out.filter((c,i) => i === 0 || c.start !== out[i-1].start);
  if(dedup.length && dedup[0].start > 0) dedup.unshift({start:0, title:'Intro'});
  dedup.forEach((c,i) => { if(!c.title) c.title = `Part ${i+1}`; });
  return dedup;
}
function chaptersToText(chs){ return chs.map(c => `${fmt(c.start)} ${c.title}`).join('\n'); }
function autoSplit(duration, minutes){
  const step = Math.max(1, minutes) * 60, out = [];
  for(let t = 0, i = 1; t < duration - 30; t += step, i++) out.push({start:t, title:`Part ${i}`});
  return out;
}

// chapters with computed end times
function chapters(v){
  const list = (v.chapters && v.chapters.length) ? v.chapters : [{start:0, title:'Full video'}];
  return list.map((c,i) => {
    const end = i < list.length - 1 ? list[i+1].start : (v.duration || null);
    return {...c, idx:i, end, len: end != null ? end - c.start : null};
  });
}
const cur = () => store.videos.find(v => v.id === store.currentId) || null;
function progressOf(v){ const chs = chapters(v); const d = chs.filter(c => v.done[c.start]).length; return {done:d, total:chs.length}; }
function curChapter(v){ const chs = chapters(v); return chs[Math.min(Math.max(v.lastChapter ?? 0, 0), chs.length - 1)]; }
function resumePoint(v){
  const c = curChapter(v);
  const t = v.lastTime;
  const start = (t != null && t >= c.start && (c.end == null || t < c.end - 2)) ? t : c.start;
  return {start, end: c.end};
}

// ================= toast & modals =================
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function openModal(html){ $('#modal').innerHTML = html; $('#modalBg').classList.add('show'); const f = $('#modal').querySelector('input,textarea'); if(f) setTimeout(() => f.focus(), 30); }
function closeModal(){ $('#modalBg').classList.remove('show'); }
$('#modalBg').addEventListener('mousedown', e => { if(e.target.id === 'modalBg') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
function confirmModal(title, bodyHtml, okLabel, onOk){
  openModal(`<h2>${esc(title)}</h2><p class="muted">${bodyHtml}</p>
    <div class="actions"><button onclick="closeModal()">Cancel</button><button class="danger-fill" id="okBtn">${esc(okLabel)}</button></div>`);
  $('#okBtn').onclick = () => { closeModal(); onOk(); };
  setTimeout(() => $('#okBtn').focus(), 30);
}
async function copyLink(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); return; }catch(e){}
  openModal(`<h2>Copy this link</h2><textarea id="linkBox" rows="4" readonly>${esc(text)}</textarea>
    <div class="actions"><button class="primary" onclick="closeModal()">Done</button></div>`);
  setTimeout(() => { const t = $('#linkBox'); t.focus(); t.select(); }, 40);
}

// ================= share links: #add=... carries a video + its chapters =================
function shareLink(v){
  const data = {y: v.ytId, t: v.title, d: v.duration || 0, c: v.chapters.map(c => [c.start, c.title])};
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  let bin = ''; bytes.forEach(x => bin += String.fromCharCode(x));
  return location.origin + location.pathname + '#add=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function readShareHash(){
  const m = location.hash.match(/^#add=([\w-]+)$/); if(!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  try{
    let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/'); while(b64.length % 4) b64 += '=';
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), ch => ch.charCodeAt(0))));
    if(!/^[\w-]{11}$/.test(d.y) || !Array.isArray(d.c)) throw 0;
    const chs = d.c.filter(x => Array.isArray(x) && typeof x[0] === 'number')
      .map(x => ({start: Math.max(0, Math.floor(x[0])), title: String(x[1] || '').slice(0, 200)}))
      .sort((p, q) => p.start - q.start);
    let v = store.videos.find(x => x.ytId === d.y);
    if(v){ if(chs.length) v.chapters = chs; if(d.d) v.duration = d.d; toast('Chapters updated from the link'); }
    else {
      v = {id: 'v' + Date.now().toString(36), ytId: d.y, title: String(d.t || 'Untitled video').slice(0, 200), titleSet: !!d.t,
        duration: d.d || null, chapters: chs, done: {}, notes: {}, lastChapter: 0, lastTime: 0, added: Date.now()};
      store.videos.push(v); toast(`Added "${v.title}" with ${chapters(v).length} chapters`);
    }
    store.currentId = v.id; save(); return true;
  }catch(e){ toast('That ChapterBox link looks broken'); return false; }
}

function renderBanner(){
  const b = $('#banner');
  if(ytMode === 'file'){
    b.innerHTML = `<div class="setup warn"><h3>This is a downloaded copy</h3>
      <p>YouTube won't play on a page opened by double-click. Open your online ChapterBox link (the one ending in <b>github.io/chapterbox</b>) and everything works there.</p></div>`;
  } else if(ytMode === 'blocked'){
    b.innerHTML = `<div class="setup warn"><h3>The YouTube player is blocked in this preview</h3>
      <p>This page is running inside a preview that blocks YouTube. Open your online ChapterBox link in a normal browser tab. Here, every chapter still has a "Watch on YouTube" link.</p></div>`;
  } else b.innerHTML = '';
}

// ================= library & views =================
function renderLibrary(){
  const lib = $('#library');
  if(!store.videos.length){ lib.innerHTML = `<h3>Your videos</h3><p class="muted" style="padding:4px">Nothing yet. Hit <b>+ Add video</b>.</p>`; return; }
  const vids = [...store.videos].sort((a,b) => (b.opened||0) - (a.opened||0));
  lib.innerHTML = `<h3>Your videos (${vids.length})</h3>` + vids.map(v => {
    const p = progressOf(v), pct = Math.round(p.done / p.total * 100);
    return `<div class="lib-item ${v.id === store.currentId ? 'active' : ''}" data-id="${v.id}">
      <div class="lib-thumb"><img src="${thumb(v.ytId)}" alt="" loading="lazy" onerror="this.remove()"></div>
      <div style="min-width:0;flex:1"><div class="lib-title">${esc(v.title)}</div>
      <div class="muted" style="font-size:12px;margin-top:3px">${p.done}/${p.total} chapters${pct === 100 ? ' ✅' : ''}</div>
      <div class="bar ${pct === 100 ? 'green' : ''}"><i style="width:${pct}%"></i></div></div></div>`;
  }).join('');
  lib.querySelectorAll('.lib-item').forEach(el => el.onclick = () => openVideo(el.dataset.id));
}

function renderEmpty(){
  $('#emptyView').innerHTML = `<h1>Split any long lecture into chapter videos 🎬</h1>
    <p class="muted">Everything is saved in this browser, on your computer.</p>
    <ol class="steps">
      <li>Click <b>+ Add video</b> and paste a YouTube link.</li>
      <li>Paste the timestamps from the video description (like <code>54:00 Problem 8</code>), or auto-split every N minutes.</li>
      <li>Every chapter becomes its own "video" that plays only that part. Tick them off as you finish them ✅</li>
    </ol>
    <button class="primary" id="emptyAdd">+ Add your first video</button>`;
  $('#emptyAdd').onclick = addVideoModal;
}

function render(){
  renderLibrary();
  const v = cur();
  $('#emptyView').hidden = !!v; $('#watchView').hidden = !v;
  if(!v){ renderEmpty(); return; }
  renderTitlebar(); renderPlaylist(); renderNow(); renderPlayerNote(); renderBar();
}

function renderTitlebar(){
  const v = cur(); const p = progressOf(v);
  const left = chapters(v).filter(c => !v.done[c.start] && c.len != null).reduce((a, c) => a + c.len, 0);
  $('#titlebar').innerHTML = `<h2 id="vtitle" title="Click to rename">${esc(v.title)}</h2>
    <span class="muted">${p.done}/${p.total} done${left ? ' · ' + fmtLen(left) + ' left' : (p.done === p.total ? ' ✅' : '')}</span>
    <button id="tbEdit">✂️ Edit chapters</button>
    <button id="tbShare" title="Copy a link that loads this video with all its chapters">🔗 Share</button>
    <a class="btn" id="tbYt" href="${watchUrl(v.ytId)}" target="_blank" rel="noopener">Open on YouTube</a>
    <button class="ghost" id="tbReset">Reset progress</button>
    <button class="ghost danger" id="tbDelete">Delete</button>`;
  $('#vtitle').onclick = renameModal;
  $('#tbEdit').onclick = editChaptersModal;
  $('#tbShare').onclick = () => copyLink(shareLink(v), 'Link copied! Whoever opens it gets this video split into the same chapters');
  $('#tbYt').onclick = function(){ this.href = watchUrl(v.ytId, playerTime() ?? resumePoint(v).start); };
  $('#tbReset').onclick = resetProgress;
  $('#tbDelete').onclick = deleteVideo;
}

function renderPlaylist(){
  const v = cur(); if(!v) return;
  const chs = chapters(v); const p = progressOf(v);
  const active = curChapter(v).idx;
  $('#playlist').innerHTML = `<div class="pl-head"><b>Chapters</b> <span class="muted">· ${p.done}/${p.total} watched</span>
      <div class="bar ${p.done === p.total ? 'green' : ''}"><i style="width:${p.done / p.total * 100}%"></i></div></div>
    <div class="pl-list">` + chs.map(c => {
      const done = !!v.done[c.start];
      const watched = done ? 100 : ((c.idx === active && c.len) ? Math.min(100, Math.max(0, ((v.lastTime || 0) - c.start) / c.len * 100)) : 0);
      return `<div class="ch ${c.idx === active ? 'active' : ''} ${done ? 'done' : ''}" data-i="${c.idx}" title="Starts at ${fmt(c.start)} in the full lecture">
        <div class="num">${c.idx === active ? '▶' : c.idx + 1}</div>
        <div class="thumb"><img src="${thumb(v.ytId)}" alt="" loading="lazy" onerror="this.remove()">
          <span class="tag">${c.idx + 1}</span>
          <span class="badge">${c.len != null ? fmt(c.len) : fmt(c.start) + '+'}</span>
          <div class="prog"><i style="width:${watched}%"></i></div></div>
        <div class="info"><div class="t">${esc(c.title)}</div>
          <div class="s">Part ${c.idx + 1} of ${chs.length}${v.notes[c.start] ? ' · 📝 notes' : ''}</div></div>
        <button class="donebtn" title="Mark as done" data-done="${c.idx}">✓</button>
      </div>`;
    }).join('') + `</div>`;
  $('#playlist').querySelectorAll('.ch').forEach(el => el.onclick = e => {
    if(e.target.dataset.done != null){ toggleDone(+e.target.dataset.done); return; }
    playChapter(+el.dataset.i, true);
  });
  const a = $('#playlist .ch.active'); if(a) a.scrollIntoView({block:'nearest'});
}

function renderNow(){
  const v = cur(); if(!v) return;
  const chs = chapters(v); const c = curChapter(v); const i = c.idx;
  const done = !!v.done[c.start];
  if(!$('#nowTop')) $('#now').innerHTML = '<div id="nowTop"></div><div class="notes" id="nowNotes"></div>';
  $('#nowTop').innerHTML = `<div class="now-top">
      <div style="flex:1;min-width:180px"><h3>${i + 1}. ${esc(c.title)}</h3>
      <div class="meta">Part ${i + 1} of ${chs.length}${c.len != null ? ' · ' + fmt(c.len) + ' long' : ''}</div></div>
      <button id="nPrev" ${i === 0 ? 'disabled' : ''}>⏮ Prev</button>
      <button id="nRestart" title="Restart this chapter">↺ Restart</button>
      <button id="nDone" class="${done ? '' : 'primary'}">${done ? '✓ Done' : 'Mark done'}</button>
      <button id="nNext" ${i === chs.length - 1 ? 'disabled' : ''}>Next ⏭</button>
    </div>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <label class="chk" style="margin:0"><input type="checkbox" id="autoNext" ${store.settings.autoNext ? 'checked' : ''}> Auto-play next chapter</label>
      <span class="muted" style="font-size:12px">Keys: <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> 5s · <kbd>Shift</kbd>+<kbd>N</kbd>/<kbd>P</kbd> next/prev · <kbd>Shift</kbd>+<kbd>D</kbd> done</span>
    </div>`;
  $('#nPrev').onclick = () => playChapter(i - 1, true, true);
  $('#nRestart').onclick = () => playChapter(i, true, true);
  $('#nDone').onclick = () => toggleDone(i);
  $('#nNext').onclick = () => playChapter(i + 1, true, true);
  $('#autoNext').onchange = e => { store.settings.autoNext = e.target.checked; save(); };
  // the notes box is only rebuilt when the chapter changes, so typing is never interrupted
  const ta = $('#notes'), key = v.id + ':' + c.start;
  if(ta && ta.dataset.key === key) return;
  if(ta && document.activeElement === ta && ta.dataset.vid === v.id){
    ta.onblur = () => { ta.onblur = null; renderNow(); };  // still typing about the previous chapter: switch when you click away
    return;
  }
  if(ta){ const ov = store.videos.find(x => x.id === ta.dataset.vid); if(ov) saveNote(ov, +ta.dataset.start, ta.value); }
  $('#nowNotes').innerHTML = `<label style="margin-top:12px">📝 My notes for ${i + 1}. ${esc(c.title)} (auto-saved)</label>
    <textarea id="notes" data-key="${esc(key)}" data-vid="${esc(v.id)}" data-start="${c.start}" placeholder="Key points, doubts, code to try...">${esc(v.notes[c.start] || '')}</textarea>`;
  let nt;
  $('#notes').oninput = e => { clearTimeout(nt); const val = e.target.value; nt = setTimeout(() => { saveNote(v, c.start, val); renderPlaylist(); }, 500); };
}
function saveNote(v, start, val){ if(val.trim()) v.notes[start] = val; else delete v.notes[start]; save(); }

function renderPlayerNote(){
  const n = $('#playerNote');
  n.innerHTML = ytMode === 'plain'
    ? `<div class="pnote">Simple player mode: YouTube's player controls didn't load (an extension may be blocking them), so chapters won't stop or tick ✓ by themselves. Use <b>Mark done</b> and <b>Next</b>.</div>`
    : '';
}

// ================= actions =================
function openVideo(id){
  const v = store.videos.find(x => x.id === id); if(!v) return;
  store.currentId = id; v.opened = Date.now(); save(); render();
  const r = resumePoint(v);
  loadIntoPlayer(v, r.start, r.end, false);
}

function playChapter(i, autoplay = true, fromStart = false){
  const v = cur(); if(!v) return;
  const chs = chapters(v); if(i < 0 || i >= chs.length) return;
  const c = chs[i];
  const sameChapter = curChapter(v).idx === i;
  v.lastChapter = i;
  const start = (!fromStart && sameChapter && v.lastTime > c.start && (c.end == null || v.lastTime < c.end - 2)) ? v.lastTime : c.start;
  v.lastTime = start; heldAt = null; save();
  renderPlaylist(); renderNow();
  loadIntoPlayer(v, start, c.end, autoplay);
}

function toggleDone(i){
  const v = cur(); const c = chapters(v)[i]; if(!c) return;
  if(v.done[c.start]) delete v.done[c.start]; else v.done[c.start] = true;
  save(); renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow();
  const p = progressOf(v); if(p.done === p.total && v.done[c.start]) toast('🎉 Whole video finished! Nice work');
}
function resetProgress(){
  const v = cur();
  confirmModal('Reset progress?', 'This clears all ✓ marks for this video. Your notes are kept.', 'Reset', () => {
    v.done = {}; v.lastChapter = 0; v.lastTime = 0; save(); render(); toast('Progress reset');
  });
}
function deleteVideo(){
  const v = cur();
  confirmModal('Delete this video?', `"${esc(v.title)}" and its notes will be removed from ChapterBox.`, 'Delete', () => {
    store.videos = store.videos.filter(x => x.id !== v.id);
    store.currentId = store.videos[0]?.id || null; save();
    try{ if(player && player.stopVideo) player.stopVideo(); }catch(e){}
    if(ytMode === 'plain') $('#playerbox').innerHTML = '<div id="player"></div>';
    if(store.currentId) openVideo(store.currentId); else render();
    toast('Deleted');
  });
}

// ================= export / import =================
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(store, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `chapterbox-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Backup downloaded');
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const data = JSON.parse(await f.text()); if(!Array.isArray(data.videos)) throw 0;
    let added = 0, updated = 0;
    for(const v of data.videos){
      if(!v || !v.ytId) continue; v.done ||= {}; v.notes ||= {}; v.chapters ||= []; v.id ||= 'v' + Math.random().toString(36).slice(2);
      const i = store.videos.findIndex(x => x.id === v.id || x.ytId === v.ytId);
      if(i >= 0){ store.videos[i] = v; updated++; } else { store.videos.push(v); added++; }
    }
    if(data.settings) store.settings = Object.assign(store.settings, data.settings);
    if(!cur() && store.videos[0]) store.currentId = store.videos[0].id;
    save(); if(cur()) openVideo(store.currentId); else render();
    toast(`Imported: ${added} new, ${updated} updated`);
  }catch(err){ toast("That file isn't a ChapterBox backup"); }
  e.target.value = '';
};
$('#addBtn').onclick = addVideoModal;
$('#helpBtn').onclick = helpModal;

// ================= YouTube player =================
let player = null, playerReady = false, pending = null;

function loadIntoPlayer(v, start, end, autoplay){
  if(ytMode === 'file' || ytMode === 'blocked'){ showOverlay(ytMode, v, start); return; }
  hideOverlay();
  if(ytMode === 'plain'){ plainEmbed(v, start, end, autoplay); return; }
  if(ytMode === 'loading'){ pending = {v, start, end, autoplay}; return; }
  if(!player){ createPlayer(v, start, autoplay); return; }
  if(!playerReady){ pending = {v, start, end, autoplay}; return; }
  try{
    const data = player.getVideoData ? player.getVideoData() : null;
    const st = player.getPlayerState();
    if(data && data.video_id === v.ytId && [0, 1, 2, 3].includes(st)){
      // same video already playing: just jump inside it, so YouTube doesn't start new ads
      player.seekTo(start, true);
      if(autoplay) player.playVideo(); else player.pauseVideo();
    } else {
      const opts = {videoId: v.ytId, startSeconds: Math.floor(start)};
      autoplay ? player.loadVideoById(opts) : player.cueVideoById(opts);
    }
  }catch(e){}
}
function resetPlayerBox(){
  try{ if(player && player.destroy) player.destroy(); }catch(e){}
  player = null; playerReady = false;
  $('#playerbox').innerHTML = '<div id="player"></div>';
}
function createPlayer(v, start, autoplay){
  resetPlayerBox();
  const vars = {start: Math.floor(start), rel: 0, playsinline: 1, autoplay: autoplay ? 1 : 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3};
  player = new YT.Player('player', {videoId: v.ytId, width: '100%', height: '100%', playerVars: vars,
    events: {onReady, onStateChange, onError}});
}
function plainEmbed(v, start, end, autoplay){
  const src = `https://www.youtube.com/embed/${v.ytId}?start=${Math.floor(start)}${end != null ? '&end=' + Math.ceil(end) : ''}&autoplay=${autoplay ? 1 : 0}&rel=0&playsinline=1`;
  $('#playerbox').innerHTML = `<iframe src="${src}" title="YouTube player" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
}
function onReady(){
  playerReady = true; applySpeed();
  if(pending){ const p = pending; pending = null; loadIntoPlayer(p.v, p.start, p.end, p.autoplay); }
}
function onStateChange(e){
  if(e.data !== YT.PlayerState.ENDED) return;
  const v = cur(); if(!v) return;
  const c = curChapter(v);
  if(!v.done[c.start]){ v.done[c.start] = true; save(); }
  renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow();
  if(c.idx === chapters(v).length - 1) toast('🎉 That was the last chapter!');
}
function onError(e){
  const v = cur(); if(!v) return;
  const t = playerTime() ?? resumePoint(v).start;
  showOverlay(e.data === 101 || e.data === 150 ? 'embedoff' : (e.data === 153 ? '153' : 'other'), v, t, e.data);
}
function playerTime(){
  if(ytMode !== 'api' || !player || !playerReady) return null;
  try{ const t = player.getCurrentTime(); return typeof t === 'number' ? t : null; }catch(e){ return null; }
}

function showOverlay(kind, v, t, code){
  hideOverlay(); if(!v) return;
  const msgs = {
    file: `YouTube won't play on a page opened by double-click. Open your online ChapterBox link instead.`,
    blocked: `This preview blocks YouTube. Open your online ChapterBox link in a normal browser tab.`,
    embedoff: `The owner of this video doesn't allow it to play on other sites.`,
    '153': `YouTube refused to play here (Error 153). Open your online ChapterBox link in a normal browser tab.`,
    other: `YouTube player error${code ? ' ' + code : ''}. Try again, or watch this part on YouTube.`
  };
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'overlay';
  o.style.backgroundImage = `linear-gradient(#000000d0,#000000d0),url(${thumb(v.ytId)})`;
  o.innerHTML = `<p><b>${msgs[kind]}</b></p>
    <a class="btn primary" href="${watchUrl(v.ytId, t)}" target="_blank" rel="noopener">▶ Watch this chapter on YouTube</a>
    <p class="muted" style="font-size:12px">Chapters, ✓ marks and notes still work here.</p>`;
  $('#playerbox').appendChild(o);
}
function hideOverlay(){ const o = $('#overlay'); if(o) o.remove(); }

// 4 times a second: follow the video, tick finished chapters, move on or stop at chapter ends
let lastSave = 0, heldAt = null;
setInterval(() => {
  renderBar();
  const v = cur(); if(ytMode !== 'api' || !v || !player || !playerReady) return;
  let st, data; try{ st = player.getPlayerState(); data = player.getVideoData ? player.getVideoData() : null; }catch(e){ return; }
  if(!(data && data.video_id === v.ytId)) return;
  try{
    const d = player.getDuration();
    const lastStart = v.chapters.length ? v.chapters[v.chapters.length - 1].start : 0;
    if((st === 1 || st === 2) && d > lastStart && (!v.duration || Math.abs(v.duration - d) > 2)){ v.duration = Math.round(d); save(); renderTitlebar(); renderPlaylist(); renderNow(); }
    if(data.title && !v.titleSet){ v.title = data.title; v.titleSet = true; save(); renderLibrary(); renderTitlebar(); }
  }catch(e){}
  if(st !== 1) return;
  applySpeed();
  const t = playerTime(); if(t == null) return;
  v.lastTime = t;
  const chs = chapters(v); const c = curChapter(v);
  if(c.end != null && t >= c.end - 0.25 && t < c.end + 2.5){
    // reached the end of this chapter
    v.done[c.start] = true;
    if(c.idx < chs.length - 1 && (store.settings.autoNext || heldAt === c.start)){
      heldAt = null; v.lastChapter = c.idx + 1;
      if(store.settings.autoNext) toast(`✓ Chapter ${c.idx + 1} done. Next up!`);
    } else if(heldAt !== c.start){
      heldAt = c.start; try{ player.pauseVideo(); }catch(e){}
      toast(c.idx === chs.length - 1 ? '🎉 That was the last chapter!' : `✓ Chapter ${c.idx + 1} done. Press play or Next to continue`);
    }
    save(); renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow(); return;
  }
  if(t < c.start - 1.5 || (c.end != null && t >= c.end + 2.5)){
    // jumped around with YouTube's own controls: follow along
    const ni = chs.findIndex(x => t >= x.start && (x.end == null || t < x.end));
    if(ni >= 0 && ni !== c.idx){ heldAt = null; v.lastChapter = ni; save(); renderPlaylist(); renderNow(); }
  }
  if(Date.now() - lastSave > 4000){ lastSave = Date.now(); save(); renderPlaylist(); }
}, 250);
window.addEventListener('beforeunload', save);

// ================= chapter-only control bar =================
const SPEEDS = [1, 1.25, 1.5, 1.75, 2, 0.75];
let scrubbing = false;
function playerState(){ try{ return player && playerReady ? player.getPlayerState() : -1; }catch(e){ return -1; } }
function chapterLen(v, c){ return c.len != null ? c.len : Math.max(0, (v.duration || 0) - c.start); }
function renderBar(){
  const bar = $('#cbar'), v = cur();
  bar.hidden = !(v && ytMode === 'api'); if(bar.hidden) return;
  const c = curChapter(v), len = chapterLen(v, c), st = playerState();
  let t = playerTime(); if(t == null || st === 5 || st === -1) t = resumePoint(v).start;
  const rel = Math.min(Math.max(t - c.start, 0), len);
  if(!scrubbing){ $('#cFill').style.width = (len ? rel / len * 100 : 0) + '%'; $('#cTime').textContent = `${fmt(rel)} / ${len ? fmt(len) : '--:--'}`; }
  $('#cPlay').textContent = st === 1 || st === 3 ? '⏸' : '▶';
  $('#cSpeed').textContent = (store.settings.speed || 1) + '×';
  let muted = false; try{ muted = !!(player && playerReady && player.isMuted()); }catch(e){}
  $('#cMute').textContent = muted ? '🔇' : '🔊';
}
function applySpeed(){
  try{ const want = store.settings.speed || 1; if(player && playerReady && player.getPlaybackRate() !== want) player.setPlaybackRate(want); }catch(e){}
}
function togglePlay(){
  const v = cur(); if(!v) return; const st = playerState();
  if(st === 1 || st === 3) player.pauseVideo();
  else if(st === 2) player.playVideo();
  else playChapter(curChapter(v).idx, true, st === 0);
  setTimeout(renderBar, 80);
}
function seekInChapter(target){
  const v = cur(); const c = curChapter(v); const len = chapterLen(v, c);
  target = Math.min(Math.max(target, c.start), c.start + Math.max(0, len - 0.5));
  heldAt = null; v.lastTime = target;
  if([1, 2, 3].includes(playerState())) player.seekTo(target, true);
  else loadIntoPlayer(v, target, c.end, true);
  renderBar();
}
function scrubTo(e, commit){
  const v = cur(); if(!v) return; const c = curChapter(v), len = chapterLen(v, c); if(!len) return;
  const r = $('#cProg').getBoundingClientRect(); const f = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  $('#cFill').style.width = f * 100 + '%'; $('#cTime').textContent = `${fmt(f * len)} / ${fmt(len)}`;
  if(commit) seekInChapter(c.start + f * len);
}
$('#cPlay').onclick = togglePlay;
$('#cProg').onpointerdown = e => { scrubbing = true; $('#cProg').setPointerCapture(e.pointerId); scrubTo(e, false); };
$('#cProg').onpointermove = e => { if(scrubbing) scrubTo(e, false); };
$('#cProg').onpointerup = e => { if(!scrubbing) return; scrubbing = false; scrubTo(e, true); };
$('#cSpeed').onclick = () => {
  const n = SPEEDS[(SPEEDS.indexOf(store.settings.speed || 1) + 1) % SPEEDS.length];
  store.settings.speed = n; save(); applySpeed(); renderBar(); toast(`Speed ${n}×`);
};
$('#cMute').onclick = () => { try{ player.isMuted() ? player.unMute() : player.mute(); }catch(e){} setTimeout(renderBar, 80); };
$('#cFs').onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : $('#playerwrap').requestFullscreen(); }catch(e){} };

// keyboard shortcuts
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if(/INPUT|TEXTAREA|SELECT/.test(tag) || !cur() || $('#modalBg').classList.contains('show')) return;
  const i = curChapter(cur()).idx;
  if(e.shiftKey){
    if(e.key === 'N'){ e.preventDefault(); playChapter(i + 1, true, true); }
    if(e.key === 'P'){ e.preventDefault(); playChapter(i - 1, true, true); }
    if(e.key === 'D'){ e.preventDefault(); toggleDone(i); }
    return;
  }
  if(e.key === ' ' || e.key === 'k'){ e.preventDefault(); togglePlay(); }
  if((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && ytMode === 'api'){
    const t = playerTime(); if(t == null) return;
    e.preventDefault(); seekInChapter(t + (e.key === 'ArrowRight' ? 5 : -5));
  }
});

// load the YouTube player API (not on double-clicked files: YouTube rejects those)
function currentRequest(){ const v = cur(); if(!v) return null; const r = resumePoint(v); return {v, start: r.start, end: r.end, autoplay: false}; }
function apiFail(){
  if(ytMode !== 'loading') return;
  ytMode = (IS_LOCALHOST || !IS_FRAMED) ? 'plain' : 'blocked';
  renderBanner(); renderPlayerNote();
  const p = pending || currentRequest(); pending = null;
  if(p) loadIntoPlayer(p.v, p.start, p.end, false);
}
window.onYouTubeIframeAPIReady = () => {
  const wasFallback = ytMode !== 'loading';
  ytMode = 'api'; renderBanner(); renderPlayerNote();
  if(wasFallback) resetPlayerBox();
  const p = pending || currentRequest(); pending = null;
  if(p) loadIntoPlayer(p.v, p.start, p.end, p.autoplay);
};
function loadYouTubeApi(){
  if(IS_FILE) return;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
  s.onerror = apiFail; document.head.appendChild(s);
  setTimeout(() => { if(ytMode === 'loading') apiFail(); }, 10000);
}

// start
readShareHash();
window.addEventListener('hashchange', () => { if(readShareHash()) openVideo(store.currentId); });
renderBanner();
render();
if(cur()) openVideo(store.currentId);
loadYouTubeApi();
</script>
