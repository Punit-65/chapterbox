}
// text copied from YouTube's transcript panel ("0:03" then the words), or an .srt / .vtt file
function parseTranscript(text){
  const out = []; let cur2 = null;
  for(const raw of String(text || '').replace(/\r/g, '').split('\n')){
    const l = raw.trim(); if(!l || /^WEBVTT/i.test(l)) continue;
    let m = l.match(/^((?:\d{1,2}:)?\d{1,2}:\d{2})(?:[.,]\d+)?\s*-->/);
    if(m){ cur2 = [toSec(m[1]), '']; out.push(cur2); continue; }
    if(/^\d+$/.test(l) && (!cur2 || cur2[1])) continue;
    m = l.match(/^((?:\d{1,2}:)?\d{1,2}:\d{2})(?:[.,]\d+)?$/);
    if(m){ cur2 = [toSec(m[1]), '']; out.push(cur2); continue; }
    m = l.match(/^((?:\d{1,2}:)?\d{1,2}:\d{2})\s+(.+)$/);
    if(m){ cur2 = [toSec(m[1]), m[2]]; out.push(cur2); continue; }
    if(cur2) cur2[1] = (cur2[1] ? cur2[1] + ' ' : '') + l.replace(/<[^>]+>/g, '');
  }
  return out.filter(x => x[1] && x[0] != null && !isNaN(x[0]));
}

async function trChunk(v, c, max = 30000){

  if(!rows.length) return '';
  let i0 = 0;
  if(rows.reduce((a, r) => a + r[1].length + 9, 0) > max){ const now = (playerTime() ?? c.start) - 300; i0 = Math.max(0, rows.findIndex(([t]) => t >= now)); }

  return `\nTranscript of this part (auto-generated captions, may have mistakes${tr.code !== 'en' && tr.en ? '; translated to English where available' : ''}). Use it as the main source:\n${txt}`;
}

async function trTranslate(v, tr, idxs, onp){

  const srcLang = tr.code || 'hi'; let done = 0;
  if('Translator' in self){
    try{
      const av = await Translator.availability({sourceLanguage: srcLang, targetLanguage: 'en'});
      if(av && av !== 'unavailable'){
        const t = await Translator.create({sourceLanguage: srcLang, targetLanguage: 'en', monitor(m){ m.addEventListener('downloadprogress', e => onp(`getting the translator ${Math.round((e.loaded || 0) * 100)}%`)); }});
        for(const n of todo){ tr.en[n] = await t.translate(tr.s[n][1]); if(++done % 25 === 0){ onp(`translating ${done}/${todo.length}`); await trPut(v.ytId, tr); } }
        await trPut(v.ytId, tr); return done;
      }
    }catch(e){}
  }
  if(!aiReady()) throw new Error("this browser can't translate by itself. Add your free AI key (" + menuName() + " → AI helper) and try again");
  const rest = todo.filter(n => !tr.en[n]);
  for(let i = 0; i < rest.length; i += 80){
    const part = rest.slice(i, i + 80);
    onp(`translating ${Math.min(i + part.length, rest.length)}/${rest.length}…`);
    let arr = null;
    for(let tries = 0; tries < 4 && !arr; tries++){
      try{ arr = parseAIJSON(await askAI(`Translate each numbered line of this lecture transcript (${tr.lang || srcLang}) into simple, natural English. Keep technical words (like if, else, loop, variable, function) in English. Reply only with JSON: an array of exactly ${part.length} strings, one per line, in the same order.\n\n${part.map((n, j) => `${j + 1}. ${tr.s[n][1]}`).join('\n')}`, true)); }

  }
  return done;
}

function gradeCard(x, gr){
  if(gr === 1){ x.n = 0; x.iv = 1; x.ef = Math.max(1.3, x.ef - 0.2); }
  else if(gr === 2){ x.iv = Math.max(1, Math.round((x.iv || 1) * 1.2)); x.ef = Math.max(1.3, x.ef - 0.15); x.n++; }
  else if(gr === 3){ x.iv = x.n === 0 ? 1 : x.n === 1 ? 3 : Math.round(x.iv * x.ef); x.n++; }
  else { x.iv = x.n === 0 ? 3 : Math.round(Math.max(1, x.iv) * x.ef * 1.3); x.ef += 0.15; x.n++; }

}

let player = null, playerReady = false, pending = null;

function loadIntoPlayer(v, start, end, autoplay){
  if(ytMode === 'file' || ytMode === 'blocked'){ showOverlay(ytMode, v, start); return; }
  hideOverlay();
  if(ytMode === 'plain'){ plainEmbed(v, start, end, autoplay); return; }
  if(ytMode === 'loading'){ pending = {v, start, end, autoplay}; return; }
  if(!player){ createPlayer(v, start, autoplay); return; }
  if(!playerReady){ pending = {v, start, end, autoplay}; return; }
  try{
    const data = player.getVideoData ? player.getVideoData() : null;
    const st = player.getPlayerState();
    if(data && data.video_id === v.ytId && [0, 1, 2, 3].includes(st)){
      // same video already playing: just jump inside it, so YouTube doesn't start new ads
      adGuard = null; player.seekTo(start, true);
      if(autoplay) player.playVideo(); else player.pauseVideo();
    } else {
      const opts = {videoId: v.ytId, startSeconds: Math.floor(start)};
      adGuard = start; autoplay ? player.loadVideoById(opts) : player.cueVideoById(opts);
    }
  }catch(e){}
}

// 4 times a second: follow the video, tick finished chapters, move on or stop at chapter ends
let lastSave = 0, heldAt = null, adGuard = null;
// YouTube ads report their own time and length; spot them so they never move your chapter
function inAd(v){
  try{
    const d = player.getDuration(), t = player.getCurrentTime();
    if(v.duration && d > 0 && Math.abs(d - v.duration) > 5) return true;
    if(adGuard != null && adGuard > 3 && t < adGuard - 3) return true;
    if(adGuard != null && t >= adGuard - 3 && player.getPlayerState() === 1) adGuard = null;
  }catch(e){}
  return false;
}
let lastTick = Date.now();
setInterval(() => {
  const nowT = Date.now(), dt = Math.min(1.5, (nowT - lastTick) / 1000); lastTick = nowT;
  renderBar();
  const v = cur(); if(ytMode !== 'api' || !v || !player || !playerReady) return;
  let st, data; try{ st = player.getPlayerState(); data = player.getVideoData ? player.getVideoData() : null; }catch(e){ return; }
  if(!(data && data.video_id === v.ytId) || inAd(v)) return;
  try{
    const d = player.getDuration();
    const lastStart = v.chapters.length ? v.chapters[v.chapters.length - 1].start : 0;
    // learn the length as soon as the video is cued (state 5, before any ad) or while it plays
    if((st === 1 || st === 2 || st === 5) && d > lastStart && (!v.duration || Math.abs(v.duration - d) > 2)){
      v.duration = Math.round(d);
      if(!(v.autoSplit && !v.chapters.length)){ save(); renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow(); }
    }
    if(v.autoSplit && !v.chapters.length && v.duration){ v.chapters = autoSplit(v.duration, v.autoSplit); delete v.autoSplit; v.lastChapter = 0; save(); render(); }
    if(data.title && !v.titleSet){ v.title = data.title; v.titleSet = true; save(); renderLibrary(); renderTitlebar(); }
  }catch(e){}
  if(st !== 1) return;
  applySpeed(); const sd = statDay(); sd.s += dt;
  const pc = paceOf(ownerOf(v).plan); if(pc > 1) sd.x = (sd.x || 0) + dt * (pc - 1);   // pausing and notes: credited as study time, at your own pace
  const okey = ownerKey(ownerOf(v)); sd.o = sd.o || {}; sd.o[okey] = (sd.o[okey] || 0) + dt;
  const hrs = store.hours || (store.hours = Array(24).fill(0)); hrs[new Date().getHours()] += dt; try{ trackBlk(dt); }catch(e){}
  const t = playerTime(); if(t == null) return;
  v.lastTime = t;
  const chs = chapters(v); const c = curChapter(v);
  v.wt = v.wt || {}; v.wt[c.key] = (v.wt[c.key] || 0) + dt;
  trackReach(v, c, t);
  if(planStop && planStop.vid === v.id && t >= planStop.at - 0.3 && t < planStop.at + 3){ planStop = null; try{ player.pauseVideo(); }catch(e){} toast("🎯 That's today's part of this chapter. Press play if you want to keep going"); }
  if(five){ five.left -= dt; if(five.left <= 0){ five = null; try{ player.pauseVideo(); }catch(e){} fiveDone(); } else if(Math.ceil(five.left) !== five.shown){ five.shown = Math.ceil(five.left); drawFive(); } }
  trFollow(v, t);
  if(c.end != null && t >= c.end - 0.25 && t < c.end + 2.5){
    // reached the end of this chapter
    markDone(v, c.key);
    if(gateOpen) return;
    if(feynNeeds(v, c)){ heldAt = c.start; feynGate(v, c); save(); renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow(); return; }
    if(c.idx < chs.length - 1 && (store.settings.autoNext || heldAt === c.start)){
      heldAt = null; v.lastChapter = c.idx + 1;
      if(store.settings.autoNext) toast(`✓ Chapter ${c.idx + 1} done. Next up!`);
    } else if(c.idx === chs.length - 1 && store.settings.autoNext && nextLecture(v) && heldAt !== c.start){
      heldAt = c.start; goNextLecture(v);
    } else if(heldAt !== c.start){
      heldAt = c.start; try{ player.pauseVideo(); }catch(e){}
      toast(c.idx === chs.length - 1 ? '🎉 That was the last chapter!' : `✓ Chapter ${c.idx + 1} done. Press play or Next to continue`);
    }
    save(); renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow(); return;
  }
  if(t < c.start - 1.5 || (c.end != null && t >= c.end + 2.5)){
    // jumped around with YouTube's own controls: follow along
    const ni = chs.findIndex(x => t >= x.start && (x.end == null || t < x.end));
    if(ni >= 0 && ni !== c.idx){ heldAt = null; v.lastChapter = ni; save(); renderPlaylist(); renderNow(); }
  }
  if(Date.now() - lastSave > 4000){ lastSave = Date.now(); save(); renderPlaylist(); }
}, 250);

// ================= ❓ v18 · jumping to a moment =================
function chapterOfTime(v, t){ const chs = chapters(v); return chs.find(x => t >= x.start && (x.end == null || t < x.end)) || chs[chs.length - 1]; }
// opens the lecture and plays from a few seconds before that moment (a short run-up so you hear what led to it)
function jumpTo(vid, t, lead = 5, qid){
  const v = store.videos.find(x => x.id === vid); if(!v) return;
  const ch = chapterOfTime(v, t), at = Math.max(ch.start, t - lead);
  closeModal();
  if(cur() !== v || view !== 'watch') openVideo(v.id);
  v.lastChapter = ch.idx; v.lastTime = at; heldAt = null; planStop = null;
  playChapter(ch.idx, true);
  qRun = qid ? {vid, id: qid, t} : null;
}
// "2:15" in this chapter, "Ch 3 · 2:15" in another one, "L4 · Ch 3 · 2:15" in another lecture
function momentLabel(vid, t){
  const mv = store.videos.find(x => x.id === vid); if(!mv) return fmt(t);
  const mc = chapterOfTime(mv, t), cv = cur(), cc = cv ? curChapter(cv) : null, parts = [];
  if(!cv || cv.id !== vid){ const o = courseOf(mv); parts.push(o ? 'L' + (courseVideos(o).indexOf(mv) + 1) : shortText(mv.title, 18)); }
  if((!cv || cv.id !== vid || !cc || cc.idx !== mc.idx) && chapters(mv).length > 1) parts.push('Ch ' + (mc.idx + 1));
  parts.push(fmt(t - mc.start));
  return parts.join(' · ');
}
async function copyText(text, okMsg){

  openModal(`<h2>Copy this</h2><textarea id="cpBox" rows="8" readonly>${esc(text)}</textarea><div class="actions"><button class="primary" onclick="closeModal()">Done</button></div>`);

async function docSearch(q){

  if(!docIdx) docIdx = await docAllRecs();

  for(const d of docMeta()){

    const rec = docIdx.get(d.id); if(!rec || !rec.pages) continue;
    const v = d.sc === 'o' ? (cur() && cur().course === d.o ? cur() : store.videos.find(x => x.course === d.o)) : store.videos.find(x => x.id === d.o); if(!v) continue;

      const t = pg.p[i][0], at = t.toLowerCase().indexOf(q);
      if(at >= 0){ res.push({v, i: ci, doc: {id: d.id, page: pg.n, para: i}, label: `📄 p.${pg.n} · …${t.slice(Math.max(0, at - 30), at + 70).replace(/\s+/g, ' ')}…`, where: `${d.name} · ${o ? '📚 ' + o.title + ' · ' : ''}${v.title}`}); if(res.length >= 25) return res; }
    }

}

function weakOf(v, c){

  const rate = (v.rate || {})[k] || 0, ex = (v.expl || {})[k], skip = !!(ex && ex.skip), exp = !!(ex && ex.t), star = !!(v.stars || {})[k], done = !!v.done[k];
