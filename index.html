<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ChapterBox — split long lectures into chapter videos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff4e45'/><path d='M40 30v40l32-20z' fill='white'/></svg>">
<style>
:root{--bg:#0f0f0f;--panel:#181818;--panel2:#222;--line:#2f2f2f;--text:#f1f1f1;--muted:#a3a3a3;--accent:#ff4e45;--good:#2ecc71;--active:#263238;--warn:#ffb74d;--input:#121212;--hover:#2d2d2d;--card:#141414;--track:#333;--chip:#262626}
[data-theme="light"]{--bg:#f6f7f9;--panel:#fff;--panel2:#eef0f3;--line:#dfe2e7;--text:#16181d;--muted:#5f6670;--active:#e7f0ff;--warn:#b26a00;--input:#fff;--hover:#eceef2;--card:#fafbfc;--track:#dde1e6;--chip:#eceef2}
[data-theme="light"] .setup{background:#eef3ff;border-color:#c9d6f5}
[data-theme="light"] .setup.warn{background:#fff5e6;border-color:#f1d4a6}
[data-theme="light"] .toast{background:#16181d;color:#fff}
[data-theme="light"] .ch.done .t{color:#1e8e4f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,a.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,a.btn:hover{background:var(--hover)}
button:disabled{opacity:.45;cursor:default}
button.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover,a.btn.primary:hover{filter:brightness(1.08)}
button.danger{color:#ff8a80}
button.danger-fill{background:#c62828;border-color:#c62828;color:#fff;font-weight:600}
button.small{padding:4px 9px;font-size:12px}
input,textarea{font:inherit;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus{outline:2px solid #3d6bff55;border-color:#3d6bff}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px;margin-right:6px;cursor:pointer}
.logo span{color:var(--accent)}
.spacer{flex:1}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 55px)}
aside{border-right:1px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 55px);position:sticky;top:55px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 4px 10px}
.lib-item{display:flex;gap:10px;padding:8px;border-radius:10px;cursor:pointer;align-items:flex-start}
.lib-item:hover{background:var(--panel)}
.lib-item.active{background:var(--active)}
.lib-thumb{width:96px;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#4a1f1d,#1d2b3d)}
.lib-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lib-title{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:4px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.green>i{background:var(--good)}
main{padding:16px;min-width:0}
.setup{background:#1b1f2a;border:1px solid #33415c;border-radius:12px;padding:16px 18px;margin-bottom:16px}
.setup.warn{background:#2a2216;border-color:#5c4a2a}
.setup h3{margin:0 0 6px;font-size:16px}
.setup p{margin:6px 0}
.setup ol{margin:8px 0;padding-left:20px}
.setup li{margin:4px 0}
.setup textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#cfd8dc;margin-top:8px}
.pill{display:inline-block;background:#3d6bff;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.empty{max-width:560px;margin:50px auto;text-align:center}
.empty h1{font-size:26px;margin:0 0 8px}
.steps{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px 14px 34px;margin:20px 0}
.steps li{margin:6px 0}
.titlebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.titlebar h2{margin:0;font-size:20px;flex:1;min-width:200px;cursor:text}
.titlebar h2:hover{text-decoration:underline dotted #666}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.playerbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.playerwrap{background:#000;border-radius:12px;overflow:hidden}
.cbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#141414}
.cbar[hidden]{display:none}
.cbar button{background:transparent;border:0;padding:5px 8px;font-size:15px;line-height:1}
.cbar button:hover{background:#2a2a2a}
.ctime{font-variant-numeric:tabular-nums;font-size:13px;color:#ddd;white-space:nowrap}
.cprog{flex:1;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none;margin:0 6px}
.ctrack{position:relative;width:100%;height:5px;background:#3a3a3a;border-radius:3px}
.cprog:hover .ctrack{height:7px}
.cfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:3px}
#cSpeed{font-size:13px;font-weight:700;min-width:46px}
.course{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--card)}
.course-head{padding:8px;cursor:pointer;border-radius:8px}
.course-head:hover{background:var(--panel)}
.course-head b{font-size:13px}
.caret{color:var(--muted);display:inline-block;width:12px}
.lnum{color:var(--accent);font-weight:800;font-size:11px}
.crumb{width:100%;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pl-way{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.pl-way ol{margin:8px 0;padding-left:20px}
.pl-way li{margin:6px 0}
a.bmk{cursor:grab}
#homeBtn.on{background:var(--active)}
.search{position:relative;flex:1;max-width:440px;margin-left:6px}
.search input{border-radius:999px;padding:7px 14px}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:60vh;overflow:auto;z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.sres[hidden]{display:none}
.sres .r{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.sres .r:hover,.sres .r.sel{background:var(--hover)}
.sres .r small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.menu.pop{position:absolute;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;min-width:210px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.menu.pop button{background:transparent;border:0;justify-content:flex-start;padding:8px 10px;width:100%}
.menu.pop button:hover{background:var(--hover)}
.home{max-width:1100px}
.hello h1{margin:0 0 4px;font-size:26px}
.hello p{margin:0}
.cont{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;cursor:pointer}
.cont:hover{border-color:var(--accent)}
.cont img{width:220px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .big{font-size:24px;font-weight:800}
.stat .big small{font-size:13px;color:var(--muted);font-weight:600}
#goalCard{cursor:pointer}
.week{display:flex;gap:8px;align-items:flex-end;height:130px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.week .b{width:100%;max-width:40px;background:var(--accent);border-radius:6px 6px 2px 2px}
.week .d.today{color:var(--text);font-weight:700}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
.sec-h h2{margin:0;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .ct{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#4a1f1d,#1d2b3d)}
.card .ct img{width:100%;height:100%;object-fit:cover;display:block}
.card .ct .badge{position:absolute;right:8px;bottom:8px;background:#000c;color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.card .cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .cb b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plan-today{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.pt-item{display:flex;gap:6px;align-items:center;padding:5px 0;font-size:13px;cursor:pointer;border-bottom:1px dashed var(--line)}
.pt-item:last-of-type{border-bottom:0}
.pt-item:hover{color:var(--accent)}
.pt-item.done{color:var(--muted);text-decoration:line-through}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chips button{padding:3px 10px;font-size:12px;border-radius:999px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.starbtn{position:absolute;right:6px;top:6px;width:24px;height:24px;border:0;background:transparent;padding:0;font-size:14px;opacity:.35;justify-content:center}
.ch:hover .starbtn,.starbtn.on{opacity:1}
.ch.hide{display:none}
#nStar.on{border-color:#e6b800}
.notes-tools{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.modal.wide{max-width:920px}
.plan-sum{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px}
.plan-warn{margin-top:8px;color:var(--warn)}
.plan-warn button{margin-left:6px}
.plan-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.plan-table th,.plan-table td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.plan-table th{background:var(--panel2)}
.plan-table tr.wk td{background:var(--panel2);font-weight:700}
.plan-table td.t{white-space:nowrap;font-variant-numeric:tabular-nums}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips label{margin:0;display:flex;gap:4px;align-items:center;color:var(--text);font-size:13px;background:var(--panel2);padding:4px 8px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.daychips input{width:auto}
.hero{text-align:center;max-width:740px;margin:36px auto 8px}
.hero h1{font-size:30px;margin:0 0 8px}
.hero .row{justify-content:center}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:940px;margin:26px auto}
.features div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.features span{color:var(--muted);font-size:13px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.cont{flex-direction:column;align-items:stretch}.cont img{width:100%}.features{grid-template-columns:1fr 1fr}}
.playerwrap:fullscreen{display:flex;flex-direction:column;border-radius:0}
.playerwrap:fullscreen .playerbox{flex:1;aspect-ratio:auto}
.playerbox iframe,#player{position:absolute;inset:0;width:100%;height:100%;border:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background-color:#000;background-size:cover;background-position:center}
.overlay p{max-width:540px;margin:0}
.pnote{font-size:12px;color:var(--warn);margin-top:8px}
.now{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.now-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.now h3{margin:0;font-size:17px}
.now .meta{color:var(--muted);font-size:12px;margin-top:2px}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.chk input{width:auto}
.playlist{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:71px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.pl-head{padding:12px 14px;border-bottom:1px solid var(--line)}
.pl-head b{font-size:15px}
.pl-list{overflow:auto;padding:6px}
.ch{display:flex;gap:10px;padding:6px;border-radius:10px;cursor:pointer;align-items:flex-start;position:relative}
.ch:hover{background:var(--hover)}
.ch.active{background:var(--active)}
.ch .num{width:20px;text-align:center;color:var(--muted);font-size:12px;padding-top:24px;flex:none}
.thumb{position:relative;width:132px;flex:none;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#4a1f1d,#1d2b3d)}
.thumb img{width:100%;height:100%;object-fit:cover;filter:brightness(.8);display:block}
.thumb .badge{position:absolute;right:4px;bottom:4px;background:#000c;color:#fff;font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px}
.thumb .tag{position:absolute;left:4px;top:4px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.thumb .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff3}
.thumb .prog i{display:block;height:100%;background:var(--accent)}
.ch .info{min-width:0;flex:1;padding-right:24px}
.ch .t{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch .s{font-size:12px;color:var(--muted);margin-top:3px}
.ch.done .t{color:#9be7b5}
.donebtn{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;border:1px solid #555;background:transparent;padding:0;font-size:12px;line-height:20px;color:transparent;justify-content:center}
.ch.done .donebtn{background:var(--good);border-color:var(--good);color:#06240f}
.donebtn:hover{border-color:var(--good);color:var(--good)}
.modal-bg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 4px;font-size:19px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:none}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.notes textarea{min-height:90px;margin-top:6px}
kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
@media (max-width:1100px){.watch{grid-template-columns:1fr}.playlist{position:static;max-height:none}}
@media (max-width:760px){header{flex-wrap:wrap}.search{order:9;flex-basis:100%;max-width:none;margin:4px 0 0}.features{grid-template-columns:1fr}.layout{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-top:1px solid var(--line);order:2;display:flex;gap:6px;overflow-x:auto}aside h3{display:none}.lib-item{flex:none;width:240px}.course{flex:none;width:270px}header .hide-sm{display:none}.keyhint{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo" title="Home">Chapter<span>Box</span></div>
  <button id="homeBtn" title="Home">🏠 Home</button>
  <div class="search"><input id="q" type="search" placeholder="🔍 Search chapters &amp; notes   ( / )" autocomplete="off"><div class="sres" id="sres" hidden></div></div>
  <div class="spacer"></div>
  <button class="primary" id="addBtn">+ Add</button>
  <button id="themeBtn" title="Light theme">☀️</button>
  <button id="menuBtn" title="More">⋯</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</header>

<div class="layout">
  <aside id="library"></aside>
  <main>
    <div id="banner"></div>
    <div id="emptyView"></div>
    <div id="homeView" hidden></div>
    <div id="watchView" hidden>
      <div class="titlebar" id="titlebar"></div>
      <div class="watch">
        <div>
          <div class="playerwrap" id="playerwrap">
            <div class="playerbox" id="playerbox"><div id="player"></div></div>
            <div class="cbar" id="cbar" hidden>
              <button id="cPlay" title="Play / pause (Space)">▶</button>
              <span class="ctime" id="cTime">0:00 / 0:00</span>
              <div class="cprog" id="cProg" title="This chapter only"><div class="ctrack"><div class="cfill" id="cFill"></div></div></div>
              <button id="cSpeed" title="Playback speed">1×</button>
              <button id="cMute" title="Mute / unmute">🔊</button>
              <button id="cFs" title="Full screen">⛶</button>
            </div>
          </div>
          <div id="playerNote"></div>
          <div class="now" id="now"></div>
        </div>
        <div class="playlist" id="playlist"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ================= storage =================
const KEY = 'chapterbox.v1';
let store = loadStore();
function loadStore(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.videos)){ s.settings = Object.assign({autoNext:true}, s.settings); s.courses = Array.isArray(s.courses) ? s.courses : []; s.stats = s.stats && typeof s.stats === 'object' ? s.stats : {}; return s; }
  }catch(e){}
  return {videos:[], courses:[], stats:{}, settings:{autoNext:true}, currentId:null};
}
let saveWarned = false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ if(!saveWarned){ toast('Could not save: browser storage is blocked here'); saveWarned = true; } }
}

// ================= where are we running? =================
const IS_FILE = location.protocol === 'file:';
const IS_LOCALHOST = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const IS_FRAMED = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
// ytMode: loading → api (full player) | plain (simple embed) | blocked (preview) ; file = opened by double-click
let ytMode = IS_FILE ? 'file' : 'loading';

// ================= helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(sec){
  sec = Math.max(0, Math.floor(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function fmtLen(sec){
  sec = Math.round(sec||0); const h = Math.floor(sec/3600), m = Math.round(sec%3600/60);
  return h ? `${h}h ${m}m` : `${Math.max(1,m)}m`;
}
function toSec(str){
  if(str == null) return null; str = String(str).trim(); if(!str) return null;
  if(/^\d+(\.\d+)?$/.test(str)) return Math.round(parseFloat(str)*60); // plain number = minutes
  const p = str.split(':').map(Number); if(p.some(isNaN) || p.length > 3) return null;
  return p.reduce((a,b) => a*60 + b, 0);
}
function ytId(s){
  s = (s||'').trim(); if(/^[\w-]{11}$/.test(s)) return s;
  try{
    const u = new URL(/^https?:\/\//.test(s) ? s : 'https://' + s);

// Parse chapters. Works with description lines ("54:00 Problem 8", "Problem 8 - 54:00")
// and with YouTube's chapter panel copy (title on one line, time on the next).
function parseChapters(text){
  const out = []; let lastText = '';
  for(const raw of (text||'').split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    const m = line.match(/(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?!\d)/);
    if(!m){ lastText = line; continue; }
    const sec = (+(m[1]||0))*3600 + (+m[2])*60 + (+m[3]);
    let title = (line.slice(0, m.index) + ' ' + line.slice(m.index + m[0].length))
      .replace(/^[\s\-–—|:.,)\]•*>]+/, '').replace(/[\s\-–—|:(\[•*]+$/, '').replace(/\s+/g, ' ').trim();
    if(!title && lastText) title = lastText;
    lastText = '';
    out.push({start: sec, title});
  }
  out.sort((a,b) => a.start - b.start);
  const dedup = out.filter((c,i) => i === 0 || c.start !== out[i-1].start);
  if(dedup.length && dedup[0].start > 0) dedup.unshift({start:0, title:'Intro'});
  dedup.forEach((c,i) => { if(!c.title) c.title = `Part ${i+1}`; });
  return dedup;
}
function chaptersToText(chs){ return chs.map(c => `${fmt(c.start)} ${c.title}`).join('\n'); }
function splitEven(duration, maxSec){
  const n = Math.max(1, Math.ceil(duration / (Math.max(60, maxSec) * 1.1))), step = duration / n, out = [];
  for(let i = 0; i < n; i++) out.push({start: Math.round(i * step), title: `Part ${i + 1} of ${n}`});
  return out;
}
function autoSplit(duration, minutes){
  const step = Math.max(1, minutes) * 60, out = [];
  for(let t = 0, i = 1; t < duration - 30; t += step, i++) out.push({start:t, title:`Part ${i}`});
  return out;
}

// chapters with computed end times
// a video (or a whole playlist) can be played whole, without its chapters; done/notes keys: chapter start, or 'w' for whole
function isWhole(v){ const c = v.course ? store.courses.find(x => x.id === v.course) : null; return c ? !!c.whole : !!v.whole; }
function chapters(v){
  const has = !!(v.chapters && v.chapters.length), whole = !has || isWhole(v);
  const list = whole ? [{start: 0, title: has ? 'Whole video' : 'Full video'}] : v.chapters;
  return list.map((c, i) => {
    const end = i < list.length - 1 ? list[i + 1].start : (v.duration || null);
    return {...c, idx: i, key: whole ? (has ? 'w' : 0) : c.start, end, len: end != null ? end - c.start : null};
  });
}
const cur = () => store.videos.find(v => v.id === store.currentId) || null;
function progressOf(v){ const chs = chapters(v); const d = chs.filter(c => v.done[c.key]).length; return {done:d, total:chs.length}; }
function curChapter(v){ const chs = chapters(v); return chs[Math.min(Math.max(v.lastChapter ?? 0, 0), chs.length - 1)]; }
function resumePoint(v){
  const c = curChapter(v);
  const t = v.lastTime;
  const start = (t != null && t >= c.start && (c.end == null || t < c.end - 2)) ? t : c.start;
  return {start, end: c.end};
}

const b64u = bytes => { let bin = ''; for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = str => { str = str.replace(/-/g, '+').replace(/_/g, '/'); while(str.length % 4) str += '='; return Uint8Array.from(atob(str), ch => ch.charCodeAt(0)); };
async function packZ(obj){ return b64u(new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())); }
async function unpackZ(str){ return JSON.parse(await new Response(new Blob([unb64u(str)]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()); }
const courseOf = v => v && v.course ? store.courses.find(c => c.id === v.course) || null : null;
function courseVideos(c){ return c.order.map(y => store.videos.find(v => v.ytId === y && v.course === c.id)).filter(Boolean); }
function nextLecture(v){ const c = courseOf(v); if(!c) return null; const l = courseVideos(c); return l[l.indexOf(v) + 1] || null; }
async function shareLink(v){
  const one = x => ({y: x.ytId, t: x.title, d: x.duration || 0, c: x.chapters.map(c => [c.start, c.title])});
  const c = courseOf(v);
  const data = c ? {p: {id: c.id, t: c.title}, v: courseVideos(c).map(one)} : {v: [one(v)]};
  return location.origin + location.pathname + '#addz=' + await packZ(data);
}
function cleanChapters(c){
  return (Array.isArray(c) ? c : []).filter(x => Array.isArray(x) && typeof x[0] === 'number')
    .map(x => ({start: Math.max(0, Math.floor(x[0])), title: String(x[1] || '').slice(0, 200)}))
    .sort((p, q) => p.start - q.start).filter((x, i, a) => i === 0 || x.start !== a[i - 1].start);
}
function importLectures(list, p, autoSplitMin){
  let course = null;
  if(p && p.id){
    course = store.courses.find(c => c.id === String(p.id));
    if(!course){ course = {id: String(p.id).slice(0, 100), title: String(p.t || 'Playlist').slice(0, 200), order: []}; if(store.settings.importWhole) course.whole = true; store.courses.push(course); }
    else if(p.t) course.title = String(p.t).slice(0, 200);
  }
  const vids = [];
  list.forEach((d, i) => {
    if(!d || !/^[\w-]{11}$/.test(d.y)) return;
    const c = cleanChapters(d.c);
    let v = store.videos.find(x => x.ytId === d.y);
    if(v){ if(c.length) v.chapters = c; if(d.d) v.duration = d.d; if(d.t && !v.titleSet){ v.title = String(d.t).slice(0, 200); v.titleSet = true; } }
    else {
      v = {id: 'v' + Date.now().toString(36) + i, ytId: d.y, title: String(d.t || 'Untitled video').slice(0, 200), titleSet: !!d.t,
        duration: d.d || null, chapters: c, done: {}, notes: {}, lastChapter: 0, lastTime: 0, added: Date.now()};
      if(!course && store.settings.importWhole) v.whole = true;
      store.videos.push(v);
    }
    if(!v.chapters.length && autoSplitMin){ if(v.duration) v.chapters = autoSplit(v.duration, autoSplitMin); else v.autoSplit = autoSplitMin; }
    if(course) v.course = course.id;
    vids.push(v);
  });
  if(course) course.order = vids.map(v => v.ytId).concat(course.order.filter(y => !vids.some(v => v.ytId === y)));
  const target = vids.find(v => progressOf(v).done < progressOf(v).total) || vids[0];
  if(target) store.currentId = target.id;
  save();
  const n = vids.reduce((a, v) => a + chapters(v).length, 0);
  toast(course ? `Added "${course.title}": ${vids.length} lectures, ${n} chapters` : vids.length ? `Added "${vids[0].title}" with ${n} chapters` : 'Nothing to add');
  return vids.length > 0;
}

function durationsViaApi(ids, onp){
  return new Promise(resolve => {

    const all = setTimeout(finish, 15000 + ids.length * 1500);

    const poll = () => {

// The "Grab chapters" bookmark. It runs on youtube.com (never on this page), reads the chapters YouTube
// already shows for each lecture, and opens ChapterBox with them. No comments inside: it becomes a bookmark.
async function grabber(APP){
  const u = new URL(location.href);
  const list = u.searchParams.get('list'), vid = u.searchParams.get('v');
  if(!/(^|\.)youtube\.com$/.test(u.hostname) || (!list && !vid)){ alert('Open a YouTube video or playlist first, then click this bookmark.'); return; }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;z-index:2147483647;top:14px;right:14px;max-width:340px;background:#ff4e45;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:12px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45)';
  const say = t => { box.textContent = 'ChapterBox: ' + t; };
  document.body.appendChild(box); say('starting…');
  const grab = (html, name) => { const i = html.indexOf(name + ' = '); if(i < 0) return null; const a = html.indexOf('{', i); const b = html.indexOf(';<\/script>', a); try{ return JSON.parse(html.slice(a, b)); }catch(e){ return null; } };
  const find = (o, key, out) => { out = out || []; if(o && typeof o === 'object'){ if(o[key]) out.push(o[key]); for(const k in o) find(o[k], key, out); } return out; };
  const txt = t => !t ? '' : typeof t === 'string' ? t : (t.content || t.simpleText || (t.runs || []).map(r => r.text).join(''));
  const page = async path => (await fetch(path, {credentials: 'include'})).text();
  try{
    let items = [], ptitle = '';
    if(list && !/^RD/.test(list)){
      say('reading the playlist…');
      const pd = grab(await page('/playlist?list=' + encodeURIComponent(list)), 'ytInitialData');
      ptitle = (pd && pd.header && pd.header.pageHeaderRenderer && pd.header.pageHeaderRenderer.pageTitle) || txt(pd && pd.metadata && pd.metadata.playlistMetadataRenderer && pd.metadata.playlistMetadataRenderer.title) || 'Playlist';
      items = find(pd, 'lockupViewModel').filter(l => l.contentType === 'LOCKUP_CONTENT_TYPE_VIDEO').map(l => ({y: l.contentId, t: txt(l.metadata && l.metadata.lockupMetadataViewModel && l.metadata.lockupMetadataViewModel.title)}));
      if(!items.length) items = find(pd, 'playlistVideoRenderer').map(v => ({y: v.videoId, t: txt(v.title)}));
      const seen = {}; items = items.filter(x => x.y && !seen[x.y] && (seen[x.y] = 1));
    }
    if(!items.length && vid) items = [{y: vid, t: ''}];
    if(!items.length) throw new Error('no videos found on this page');
    let n = 0; const queue = items.slice();
    const one = async it => {
      const html = await page('/watch?v=' + it.y);
      const wd = grab(html, 'ytInitialData'); const seen = {};
      it.c = find(wd, 'chapterRenderer').map(c => [Math.round(c.timeRangeStartMillis / 1000), txt(c.title)]).filter(c => !seen[c[0]] && (seen[c[0]] = 1)).sort((a, b) => a[0] - b[0]);
      const len = html.match(/"lengthSeconds":"(\d+)"/); it.d = len ? +len[1] : 0;
      if(!it.t){ const tm = html.match(/"videoDetails":\{"videoId":"[^"]*","title":"((?:[^"\\]|\\.)*)"/); try{ it.t = tm ? JSON.parse('"' + tm[1] + '"') : ''; }catch(e){ it.t = ''; } }
      n++; say('getting chapters ' + n + '/' + items.length + '…');
    };
    await Promise.all([0, 1, 2].map(async () => { while(queue.length){ const it = queue.shift(); try{ await one(it); }catch(e){ it.c = it.c || []; } } }));
    const data = list && items.length > 1 ? {p: {id: list, t: ptitle}, v: items} : {v: items};
    const z = new Uint8Array(await new Response(new Blob([JSON.stringify(data)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
    let bin = ''; for(let i = 0; i < z.length; i++) bin += String.fromCharCode(z[i]);
    const url = APP + '#addz=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const total = items.reduce((a, x) => a + (x.c ? x.c.length : 0), 0);
    say('got ' + items.length + (items.length > 1 ? ' lectures' : ' video') + ' with ' + total + ' chapters. Opening ChapterBox…');
    if(window.__chapterboxTest) return url;
    const w = window.open(url, '_blank'); if(!w) location.href = url;
    setTimeout(() => box.remove(), 5000);
  }catch(e){ say('something went wrong: ' + e.message); setTimeout(() => box.remove(), 8000); }
}

  try{ if([1, 3].includes(playerState())) player.pauseVideo(); }catch(e){}
  render(); window.scrollTo(0, 0);
}

function renderTitlebar(){
  const v = cur(); const p = progressOf(v);
  const left = chapters(v).filter(c => !v.done[c.key] && c.len != null).reduce((a, c) => a + c.len, 0);
  const course = courseOf(v), o = ownerOf(v), nx = nextLecture(v), lnum = course ? courseVideos(course).indexOf(v) + 1 : 0, whole = isWhole(v);
  const hasCh = ownerVideos(o).some(x => x.chapters && x.chapters.length);
  $('#titlebar').innerHTML = `${course ? `<div class="crumb">📚 ${esc(course.title)} · Lecture ${lnum} of ${courseVideos(course).length}</div>` : ''}<h2 id="vtitle" title="Click to rename">${esc(v.title)}</h2>
    <span class="muted">${p.done}/${p.total} done${left ? ' · ' + fmtLen(left) + ' left' : (p.done === p.total ? ' ✅' : '')}</span>
    <button id="tbEdit">✂️ Edit chapters</button>
    ${hasCh ? `<button id="tbWhole" title="${whole ? 'Split the video' + (course ? 's of this playlist' : '') + ' into chapters again' : 'Play ' + (course ? 'every video of this playlist' : 'this video') + ' whole, without chapters'}">${whole ? '✂️ Use chapters' : '🎞 No chapters'}</button>` : ''}
    <button id="tbPlan" title="Make a day-by-day study plan">📅 ${o.plan ? 'Plan' : 'Make a plan'}</button>
    ${nx ? '<button id="tbNextLec" title="Open the next lecture of this playlist">Next lecture ⏭</button>' : ''}
    <button id="tbMore" title="Share, notes, rename, delete…">⋯</button>`;
  $('#vtitle').onclick = renameModal;
  $('#tbEdit').onclick = editChaptersModal;
  if(hasCh) $('#tbWhole').onclick = () => toggleWhole(v);
  $('#tbPlan').onclick = () => planModal(o);
  if(nx) $('#tbNextLec').onclick = () => openVideo(nx.id);
  $('#tbMore').onclick = e => { e.stopPropagation(); popMenu(e.currentTarget, [
    [course ? '🔗 Share this playlist' : '🔗 Share this video', async () => copyLink(await shareLink(v), course ? 'Playlist link copied! It adds every lecture with its chapters' : 'Link copied! Whoever opens it gets this video split into the same chapters')],
    [course ? '📝 Download playlist notes' : '📝 Download notes', () => downloadNotes(o)],
    ['▶ Open on YouTube', () => window.open(watchUrl(v.ytId, playerTime() ?? resumePoint(v).start), '_blank', 'noopener')],
    ['✏️ Rename', renameModal],
    ['↺ Reset progress', resetProgress],
    ['🗑 Delete', deleteVideo]]); };
}
function toggleWhole(v){
  const o = ownerOf(v); o.whole = !o.whole;
  const t = playerTime() ?? resumePoint(v).start;
  const ci = chapters(v).findIndex(c => t >= c.start && (c.end == null || t < c.end));
  v.lastChapter = Math.max(0, ci); heldAt = null; save(); render();
  const playing = [1, 3].includes(playerState()), c = curChapter(v);
  loadIntoPlayer(v, t, c.end, playing);
  toast(o.whole ? '🎞 Playing whole videos, no chapters' : '✂️ Chapters are back');
}

let lastActiveShown = null;
function renderPlaylist(){
  const v = cur(); if(!v) return;
  const chs = chapters(v); const p = progressOf(v);
  const active = curChapter(v).idx, f = store.settings.filter || 'all', stars = v.stars || {};
  const old = $('#playlist .pl-list'), keep = old ? old.scrollTop : 0;
  $('#playlist').innerHTML = `<div class="pl-head"><b>${chs.length === 1 && v.chapters.length ? 'Whole video' : 'Chapters'}</b> <span class="muted">· ${p.done}/${p.total} watched</span>
      <div class="bar ${p.done === p.total ? 'green' : ''}"><i style="width:${p.done / p.total * 100}%"></i></div>
      ${chs.length > 1 ? `<div class="chips">${[['all', 'All'], ['todo', 'To do'], ['star', '⭐ Revise']].map(([k, l]) => `<button data-f="${k}" class="${f === k ? 'on' : ''}">${l}</button>`).join('')}</div>` : ''}</div>
    <div class="pl-list">` + chs.map(c => {
      const done = !!v.done[c.key], star = !!stars[c.key];
      const hide = chs.length > 1 && ((f === 'todo' && done) || (f === 'star' && !star));
      const watched = done ? 100 : ((c.idx === active && c.len) ? Math.min(100, Math.max(0, ((v.lastTime || 0) - c.start) / c.len * 100)) : 0);
      return `<div class="ch ${c.idx === active ? 'active' : ''} ${done ? 'done' : ''} ${hide ? 'hide' : ''}" data-i="${c.idx}" title="Starts at ${fmt(c.start)} in the full lecture">
        <div class="num">${c.idx === active ? '▶' : c.idx + 1}</div>
        <div class="thumb"><img src="${thumb(v.ytId)}" alt="" loading="lazy" onerror="this.remove()">
          <span class="tag">${c.idx + 1}</span>
          <span class="badge">${c.len != null ? fmt(c.len) : fmt(c.start) + '+'}</span>
          <div class="prog"><i style="width:${watched}%"></i></div></div>
        <div class="info"><div class="t">${esc(c.title)}</div>
          <div class="s">Part ${c.idx + 1} of ${chs.length}${v.notes[c.key] ? ' · 📝 notes' : ''}</div></div>
        <button class="starbtn ${star ? 'on' : ''}" title="Mark to revise" data-star="${c.idx}">${star ? '⭐' : '☆'}</button>
        <button class="donebtn" title="Mark as done" data-done="${c.idx}">✓</button>
      </div>`;
    }).join('') + `</div>`;
  $('#playlist').querySelectorAll('.chips button').forEach(b => b.onclick = () => { store.settings.filter = b.dataset.f; save(); renderPlaylist(); });
  $('#playlist').querySelectorAll('.ch').forEach(el => el.onclick = e => {
    if(e.target.dataset.done != null){ toggleDone(+e.target.dataset.done); return; }
    if(e.target.dataset.star != null){ toggleStar(+e.target.dataset.star); return; }
    playChapter(+el.dataset.i, true);
  });
  // keep the list where you scrolled it; only bring the playing chapter into view when it changes
  const list = $('#playlist .pl-list'); list.scrollTop = keep;
  const id = v.id + ':' + active;
  if(lastActiveShown !== id){
    lastActiveShown = id;
    const a = $('#playlist .ch.active');
    if(a){ const lr = list.getBoundingClientRect(), ar = a.getBoundingClientRect(); if(ar.top < lr.top || ar.bottom > lr.bottom) list.scrollTop += ar.top - lr.top - 8; }
  }
}

function renderNow(){
  const v = cur(); if(!v) return;
  const chs = chapters(v); const c = curChapter(v); const i = c.idx;
  const done = !!v.done[c.key], star = !!(v.stars || {})[c.key];
  if(!$('#nowTop')) $('#now').innerHTML = '<div id="nowTop"></div><div class="notes" id="nowNotes"></div>';
  $('#nowTop').innerHTML = `<div class="now-top">
      <div style="flex:1;min-width:180px"><h3>${i + 1}. ${esc(c.title)}</h3>
      <div class="meta">Part ${i + 1} of ${chs.length}${c.len != null ? ' · ' + fmt(c.len) + ' long' : ''}</div></div>
      <button id="nPrev" ${i === 0 ? 'disabled' : ''}>⏮ Prev</button>
      <button id="nRestart" title="Restart this chapter">↺ Restart</button>
      <button id="nStar" class="${star ? 'on' : ''}" title="Mark to revise later (Shift+S)">${star ? '⭐ Revise' : '☆ Revise'}</button>
      <button id="nDone" class="${done ? '' : 'primary'}">${done ? '✓ Done' : 'Mark done'}</button>
      <button id="nNext" ${i === chs.length - 1 ? 'disabled' : ''}>Next ⏭</button>
    </div>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <label class="chk" style="margin:0"><input type="checkbox" id="autoNext" ${store.settings.autoNext ? 'checked' : ''}> Auto-play next chapter</label>
      <span class="muted keyhint" style="font-size:12px">Keys: <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> 5s · <kbd>Shift</kbd>+<kbd>N</kbd>/<kbd>P</kbd> next/prev · <kbd>?</kbd> all keys</span>
    </div>`;
  $('#nPrev').onclick = () => playChapter(i - 1, true, true);
  $('#nRestart').onclick = () => playChapter(i, true, true);
  $('#nStar').onclick = () => toggleStar(i);
  $('#nDone').onclick = () => toggleDone(i);
  $('#nNext').onclick = () => playChapter(i + 1, true, true);
  $('#autoNext').onchange = e => { store.settings.autoNext = e.target.checked; save(); };
  // the notes box is only rebuilt when the chapter changes, so typing is never interrupted
  const ta = $('#notes'), key = v.id + ':' + c.key;
  if(ta && ta.dataset.key === key) return;
  if(ta && document.activeElement === ta && ta.dataset.vid === v.id){
    ta.onblur = () => { ta.onblur = null; renderNow(); };  // still typing about the previous chapter: switch when you click away
    return;
  }
  if(ta){ const ov = store.videos.find(x => x.id === ta.dataset.vid); if(ov) saveNote(ov, ta.dataset.k, ta.value); }
  $('#nowNotes').innerHTML = `<label style="margin-top:12px">📝 My notes for ${i + 1}. ${esc(c.title)} (auto-saved)</label>
    <textarea id="notes" data-key="${esc(key)}" data-vid="${esc(v.id)}" data-k="${esc(c.key)}" placeholder="Key points, doubts, code to try...">${esc(v.notes[c.key] || '')}</textarea>
    <div class="notes-tools"><button class="small" id="nTime" title="Insert the current time of this chapter">⏱ Insert time</button>
    <span class="muted" style="font-size:12px">Double-click a time like [2:15] in your notes to jump there.</span></div>`;
  const box = $('#notes'); let nt;
  box.oninput = e => { clearTimeout(nt); const val = e.target.value; nt = setTimeout(() => { saveNote(v, c.key, val); renderPlaylist(); }, 500); };
  box.ondblclick = () => {
    const pos = box.selectionStart, re = /\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?/g; let m;
    while((m = re.exec(box.value))){ if(pos >= m.index && pos <= m.index + m[0].length){ jumpInChapter(v, c, toSec(m[1])); return; } }
  };
  $('#nTime').onclick = () => {
    const t = playerTime(), rel = t == null ? 0 : Math.max(0, t - c.start);
    const ins = `[${fmt(rel)}] `, a = box.selectionStart ?? box.value.length, b = box.selectionEnd ?? a;
    box.value = box.value.slice(0, a) + ins + box.value.slice(b); box.focus(); box.setSelectionRange(a + ins.length, a + ins.length);
    box.dispatchEvent(new Event('input'));
  };
}
function saveNote(v, key, val){ if(val.trim()) v.notes[key] = val; else delete v.notes[key]; save(); }
function jumpInChapter(v, c, rel){
  if(cur() !== v) return;
  if(curChapter(v).idx !== c.idx){ v.lastChapter = c.idx; renderPlaylist(); renderNow(); }
  seekInChapter(c.start + rel);
  if(playerState() === 2) player.playVideo();
}

function renderPlayerNote(){
  const n = $('#playerNote');
  n.innerHTML = ytMode === 'plain'
    ? `<div class="pnote">Simple player mode: YouTube's player controls didn't load (an extension may be blocking them), so chapters won't stop or tick ✓ by themselves. Use <b>Mark done</b> and <b>Next</b>.</div>`
    : '';
}

// ================= actions =================
function openVideo(id){
  const v = store.videos.find(x => x.id === id); if(!v) return;
  store.currentId = id; v.opened = Date.now(); advancing = null; view = 'watch'; save(); render();
  const r = resumePoint(v);
  loadIntoPlayer(v, r.start, r.end, false);
}

function playChapter(i, autoplay = true, fromStart = false){
  const v = cur(); if(!v) return;
  const chs = chapters(v); if(i < 0 || i >= chs.length) return;
  const c = chs[i];
  const sameChapter = curChapter(v).idx === i;
  v.lastChapter = i;
  const start = (!fromStart && sameChapter && v.lastTime > c.start && (c.end == null || v.lastTime < c.end - 2)) ? v.lastTime : c.start;
  v.lastTime = start; heldAt = null; save();
  renderPlaylist(); renderNow();
  loadIntoPlayer(v, start, c.end, autoplay);
}

function markDone(v, key){ if(v.done[key]) return; v.done[key] = true; statDay().c++; }
function toggleDone(i){
  const v = cur(); const c = chapters(v)[i]; if(!c) return;
  if(v.done[c.key]) delete v.done[c.key]; else markDone(v, c.key);
  save(); renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow();
  const p = progressOf(v); if(p.done === p.total && v.done[c.key]) toast('🎉 Whole video finished! Nice work');
}
function toggleStar(i){
  const v = cur(); const c = chapters(v)[i]; if(!c) return;
  v.stars = v.stars || {};
  if(v.stars[c.key]) delete v.stars[c.key]; else v.stars[c.key] = true;
  save(); renderPlaylist(); renderNow(); toast(v.stars[c.key] ? '⭐ Added to your revise list' : 'Removed from your revise list');
}
function resetProgress(){
  const v = cur();
  confirmModal('Reset progress?', 'This clears all ✓ marks for this video. Your notes are kept.', 'Reset', () => {
    v.done = {}; v.lastChapter = 0; v.lastTime = 0; save(); render(); toast('Progress reset');
  });
}
function deleteVideo(){
  const v = cur(), course = courseOf(v);
  openModal(`<h2>Delete?</h2><p class="muted">"${esc(v.title)}" and its notes will be removed from ChapterBox.</p>
    <div class="actions"><button onclick="closeModal()">Cancel</button>
    ${course ? `<button class="danger-fill" id="delAll">Delete whole playlist (${courseVideos(course).length})</button>` : ''}
    <button class="danger-fill" id="delOne">Delete this ${course ? 'lecture' : 'video'}</button></div>`);
  const finish = ids => {
    closeModal();
    store.videos = store.videos.filter(x => !ids.includes(x.id));
    store.courses.forEach(c => { c.order = c.order.filter(y => store.videos.some(x => x.ytId === y && x.course === c.id)); });
    store.courses = store.courses.filter(c => c.order.length);
    store.currentId = store.videos[0]?.id || null; save();
    try{ if(player && player.stopVideo) player.stopVideo(); }catch(e){}
    if(ytMode === 'plain') $('#playerbox').innerHTML = '<div id="player"></div>';
    if(store.currentId) openVideo(store.currentId); else render();
    toast('Deleted');
  };
  $('#delOne').onclick = () => finish([v.id]);
  if(course) $('#delAll').onclick = () => finish(courseVideos(course).map(x => x.id));
}

// ================= modals =================
function renameModal(){
  const v = cur();
  openModal(`<h2>Rename video</h2><label>Name</label><input id="rName" value="${esc(v.title)}">
    <div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" id="rSave">Save</button></div>`);
  const go = () => { const n = $('#rName').value.trim(); if(n){ v.title = n; v.titleSet = true; save(); render(); } closeModal(); };
  $('#rSave').onclick = go;
  $('#rName').onkeydown = e => { if(e.key === 'Enter') go(); };
}

function addVideoModal(tab){
  if(tab === 'playlist') return addPlaylistModal();
  openModal(`<div class="tabs"><button class="on">🎬 Video</button><button id="toPl">📚 Playlist</button></div>
    <h2>Add a YouTube video</h2><p class="muted" style="margin:0">Long lectures, courses, one-shots... anything.</p>
    <label>YouTube link</label><input id="mUrl" placeholder="https://www.youtube.com/watch?v=...">
    <label>Name (optional, taken from YouTube if empty)</label><input id="mTitle" placeholder="e.g. C Programming L2: If Else">
    <label>Chapters / timestamps (optional)</label>
    <textarea id="mChaps" rows="8" placeholder="Paste the timestamps from the description, one per line:\n0:00 Introduction\n12:45 If statement\n54:00 Problem 8 - divisible by 5 or 3\n1:04:08 Homework 3"></textarea>
    <div class="hint">Any line with a time works (<code>1:04:08 Title</code> or <code>Title - 54:00</code>). Copying YouTube's chapter list (title line, then time line) works too. Leave it empty to add chapters later.</div>
    <label>…or auto-split every N minutes (needs the video length)</label>
    <div class="row"><input id="mEvery" type="number" min="1" placeholder="minutes, e.g. 20" style="width:150px">
    <input id="mLen" placeholder="video length, e.g. 2:55:23" style="width:200px"></div>
    <div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" id="mSave">Add video</button></div>`);
  $('#toPl').onclick = () => addPlaylistModal();
  $('#mSave').onclick = () => {
    const url = $('#mUrl').value, id = ytId(url);
    if(!id && playlistId(url)){ addPlaylistModal(url); return; }
    if(!id){ toast("That doesn't look like a YouTube link"); $('#mUrl').focus(); return; }
    const existing = store.videos.find(v => v.ytId === id);
    if(existing){ closeModal(); openVideo(existing.id); toast('Already in your library, so I opened it'); return; }
    const len = toSec($('#mLen').value); const every = +$('#mEvery').value;
    let chs = parseChapters($('#mChaps').value);
    if(!chs.length && every && len) chs = autoSplit(len, every);
    else if(!chs.length && every && !len){ toast('Add the video length to auto-split'); $('#mLen').focus(); return; }
    const title = $('#mTitle').value.trim();
    const v = {id: 'v' + Date.now().toString(36), ytId: id, title: title || 'Untitled video', titleSet: !!title,
      duration: len || null, chapters: chs, done: {}, notes: {}, lastChapter: 0, lastTime: urlStart(url), added: Date.now()};
    if(v.lastTime){ const ci = chapters(v).findIndex(c => v.lastTime >= c.start && (c.end == null || v.lastTime < c.end)); v.lastChapter = Math.max(0, ci); }
    store.videos.push(v); closeModal(); openVideo(v.id);
    toast(chs.length ? `Added with ${chs.length} chapters` : 'Added! Now click ✂️ Edit chapters');
  };
}

function editChaptersModal(){
  const v = cur();
  openModal(`<h2>✂️ Edit chapters</h2><p class="muted" style="margin:0">One chapter per line: <code>time title</code>. A chapter ends where the next one starts.</p>
    <label>Chapters</label>
    <textarea id="eChaps" rows="13" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(v.chapters.length ? chaptersToText(v.chapters) : '')}</textarea>
    <div class="row" style="margin-top:8px">
      <button class="small" id="eNow" title="Adds the player's current time as a new line">+ Insert current player time</button>
      <span class="muted" style="font-size:12px">Tip: pause where a topic starts, then click this.</span>
    </div>
    <label>Video length (fills in by itself once the video loads)</label>
    <input id="eLen" value="${v.duration ? fmt(v.duration) : ''}" placeholder="e.g. 2:55:23" style="width:200px">
    <label>Auto-split instead</label>
    <div class="row"><span class="muted">Every</span><input id="eEvery" type="number" min="1" value="20" style="width:80px"><span class="muted">minutes</span>
    <button class="small" id="eGen">Generate</button></div>
    <div class="hint">Your ✓ marks and notes stay with every chapter whose start time didn't change.</div>
    <div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" id="eSave">Save chapters</button></div>`);
  $('#eNow').onclick = () => {
    const t = playerTime(); if(t == null){ toast('This works once the player is running'); return; }
    const ta = $('#eChaps');
    ta.value = ta.value.replace(/\s*$/, '') + (ta.value.trim() ? '\n' : '') + `${fmt(t)} `;
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  };
  $('#eGen').onclick = () => {
    const len = toSec($('#eLen').value); if(!len){ toast('Enter the video length first'); $('#eLen').focus(); return; }
    $('#eChaps').value = chaptersToText(autoSplit(len, +$('#eEvery').value || 20));
  };
  $('#eSave').onclick = () => {
    const len = toSec($('#eLen').value); if(len) v.duration = len;
    const oldStart = curChapter(v).start;
    v.chapters = parseChapters($('#eChaps').value);
    const ni = chapters(v).findIndex(c => c.start === oldStart); v.lastChapter = ni >= 0 ? ni : 0;
    save(); closeModal(); render(); toast(`Saved ${chapters(v).length} chapters`);
    let playing = false; try{ playing = ytMode === 'api' && player && playerReady && player.getPlayerState() === 1; }catch(e){}
    const c = curChapter(v); const t = playerTime();
    loadIntoPlayer(v, (t != null && t >= c.start && (c.end == null || t < c.end)) ? t : c.start, c.end, playing);
  };
}

function addPlaylistModal(prefill){
  openModal(`<div class="tabs"><button id="toVid">🎬 Video</button><button class="on">📚 Playlist</button></div>

      <label class="chk" style="margin-top:10px"><input type="checkbox" id="impWhole" ${store.settings.importWhole ? 'checked' : ''}> Keep each video whole when grabbing (no chapter splitting)</label>
    </div>
    <div class="pl-way"><b>📋 Add a playlist without chapters</b> <span class="muted">(paste its link; each video plays whole)</span>

    </div>`);
  $('#toVid').onclick = () => addVideoModal();

      if(!v || !v.ytId) continue; v.done ||= {}; v.notes ||= {}; v.chapters ||= []; v.id ||= 'v' + Math.random().toString(36).slice(2);

function resumeIdx(v){

// ================= study planner =================
function remainingItems(o){
  const out = [];
  ownerVideos(o).forEach((v, li) => chapters(v).forEach(c => { if(!v.done[c.key]){ const len = chapterLen(v, c); out.push({v, c, li, len: len || 1800, est: !len}); } }));
  return out;
}
function computePlan(o, p){
  p = p || o.plan; if(!p) return null;
  const items = remainingItems(o), total = items.reduce((a, x) => a + x.len, 0);
  const wd = p.days && p.days.length ? p.days : [0, 1, 2, 3, 4, 5, 6];
  const today = parseDay(dayKey());
  let budget, avail = null;
  if(p.mode === 'date'){
    const end = parseDay(p.date); avail = 0;
    for(const d = new Date(today); d <= end; d.setDate(d.getDate() + 1)) if(wd.includes(d.getDay())) avail++;
    budget = Math.max(300, Math.ceil(total / Math.max(1, avail)));
  } else budget = Math.max(5, +p.minutes || 60) * 60;
  const days = []; let i = 0; const d = new Date(today);
  while(i < items.length && days.length < 3650){
    if(wd.includes(d.getDay())){
      const list = []; let used = 0;
      while(i < items.length && (!list.length || used + items[i].len <= budget * 1.1)){ list.push(items[i]); used += items[i].len; i++; }
      days.push({date: new Date(d), items: list, secs: used});
    }
    d.setDate(d.getDate() + 1);
  }
  return {budget, total, days, avail, est: items.some(x => x.est)};
}
function todayPlan(o){
  if(!o.plan) return [];
  const k = dayKey();
  if(!o.planToday || o.planToday.date !== k){
    const pl = computePlan(o), first = pl && pl.days[0];
    o.planToday = {date: k, items: first && dayKey(first.date) === k ? first.items.map(x => [x.v.id, x.c.key]) : []};
    save();
  }
  return o.planToday.items.map(([vid, key]) => { const v = store.videos.find(x => x.id === vid); const c = v && chapters(v).find(x => String(x.key) === String(key)); return c ? {v, c, done: !!v.done[c.key]} : null; }).filter(Boolean);
}
function todayCard(o){
  const items = todayPlan(o), done = items.filter(x => x.done).length, secs = items.reduce((a, x) => a + (chapterLen(x.v, x.c) || 0), 0);
  const next = items.find(x => !x.done), pl = computePlan(o), upcoming = !items.length && pl && pl.days[0] ? pl.days[0].date : null;
  return `<div class="plan-today"><div class="row" style="justify-content:space-between"><b>${o.order ? '📚 ' : '🎬 '}${esc(o.title)}</b>
    ${items.length ? `<span class="muted">${done}/${items.length} chapters · ${fmt(secs)}</span>` : ''}</div>
    ${items.length ? items.map(x => `<div class="pt-item ${x.done ? 'done' : ''}" data-tv="${x.v.id}" data-ti="${x.c.idx}">${x.done ? '✅' : '⬜'} ${o.order ? `<span class="lnum">L${courseVideos(o).indexOf(x.v) + 1}</span>` : ''} ${x.c.idx + 1}. ${esc(x.c.title)} <span class="muted">· ${fmt(chapterLen(x.v, x.c) || 0)}</span></div>`).join('')
      : `<div class="muted" style="margin-top:6px">${pl && !pl.days.length ? 'Everything is done. 🎉' : `Rest day 😌${upcoming ? ' Next study day: ' + DAYS[upcoming.getDay()] + ', ' + fmtDay(upcoming) : ''}`}</div>`}
    ${next ? `<button class="primary small" style="margin-top:8px" data-tv="${next.v.id}" data-ti="${next.c.idx}">▶ ${done ? 'Keep going' : "Start today's plan"}</button>` : items.length ? "<div style=\"margin-top:6px\">🎉 Today's plan is done!</div>" : ''}</div>`;
}
function planTable(o, p){
  if(!p.days.length) return '<p class="muted">Pick at least one study day.</p>';
  const pl = computePlan(o, p);
  if(!pl.days.length) return '<p>🎉 Nothing left to plan. Everything is done!</p>';
  const end = pl.days[pl.days.length - 1].date;
  const long = new Set(remainingItems(o).filter(x => !x.est && chapters(x.v).length === 1 && x.len > pl.budget * 1.1).map(x => x.v)).size;
  const longNote = long ? `<div class="plan-warn">⚠️ ${long === 1 ? '1 lecture is' : long + ' lectures are'} longer than ${fmtDur(pl.budget)} and ${long === 1 ? 'plays' : 'play'} whole, so ${long === 1 ? 'that day runs' : 'those days run'} long.
      <button class="small" id="pSplit">✂️ Split ${long === 1 ? 'it' : 'them'} into ~${fmtDur(pl.budget)} parts</button></div>` : '';
  const weekStart = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const ranges = items => { const out = []; for(const x of items){ const r = out[out.length - 1]; if(r && r.v === x.v && r.to.idx + 1 === x.c.idx){ r.to = x.c; r.n++; } else out.push({v: x.v, li: x.li, from: x.c, to: x.c, n: 1}); } return out; };
  let html = `<div class="plan-sum">${p.mode === 'date' ? `To finish by <b>${fmtDay(parseDay(p.date))}</b> you need about <b>${fmt(pl.budget)}</b> a day.` : `At <b>${fmt(pl.budget)}</b> a day you'll finish on <b>${fmtDay(end)}</b>.`}
    ${pl.days.length} study days · ${fmt(pl.total)} in total${pl.est ? ' · some lengths are estimates (30 min) until those videos are opened' : ''}${p.mode === 'date' && pl.days.length > pl.avail ? ` · <span style="color:var(--warn)">needs ${pl.days.length - pl.avail} extra day${pl.days.length - pl.avail > 1 ? 's' : ''}, because chapters aren't cut in half</span>` : ''}${longNote}</div>
    <table class="plan-table"><tr><th>Day</th><th>Date</th><th>What to watch</th><th>Time</th></tr>`;
  let wk = null, shown = 0;
  for(const day of pl.days){
    if(shown++ >= 70){ html += `<tr><td colspan="4" class="muted">…and ${pl.days.length - 70} more days</td></tr>`; break; }
    const ws = dayKey(weekStart(day.date));
    if(ws !== wk){ wk = ws; const w = pl.days.filter(x => dayKey(weekStart(x.date)) === ws); html += `<tr class="wk"><td colspan="3">Week of ${fmtDay(weekStart(day.date))} · ${w.length} study day${w.length > 1 ? 's' : ''}</td><td class="t">${fmt(w.reduce((a, x) => a + x.secs, 0))}</td></tr>`; }
    html += `<tr><td>${DAYS[day.date.getDay()]}${dayKey(day.date) === dayKey() ? ' <b>(today)</b>' : ''}</td><td>${fmtDay(day.date)}</td><td>${ranges(day.items).map(r => `${o.order ? `<span class="lnum">L${r.li + 1}</span> ` : ''}${r.n > 1 ? `${r.from.idx + 1}. ${esc(r.from.title)} → ${r.to.idx + 1}. ${esc(r.to.title)} <span class="muted">(${r.n} chapters)</span>` : `${r.from.idx + 1}. ${esc(r.from.title)}`}`).join('<br>')}</td><td class="t">${fmt(day.secs)}</td></tr>`;
  }
  return html + '</table>';
}
// cut lectures that play whole and are longer than a study day into equal parts; parts already watched get ticked
function splitLong(o, budget){
  const hit = [];
  for(const v of ownerVideos(o)){
    const chs = chapters(v);
    if(chs.length !== 1 || v.done[chs[0].key] || !v.duration || v.duration <= budget * 1.1) continue;
    let t = v.lastTime || 0;
    try{ if(v === cur() && player.getVideoData().video_id === v.ytId) t = playerTime() ?? t; }catch(e){}
    if(v.chapters.length < 2) v.chapters = splitEven(v.duration, budget);
    hit.push([v, t]);
  }
  if(!hit.length) return 0;
  delete o.whole; o.planToday = null;
  for(const [v, t] of hit){
    const chs = chapters(v), ci = chs.findIndex(c => t >= c.start && (c.end == null || t < c.end));
    for(const c of chs) if(c.end != null && c.end <= t + 1) v.done[c.key] = true;
    v.lastChapter = Math.max(0, ci);
  }
  heldAt = null;
  return hit.length;
}
function planModal(o){
  const p0 = o.plan || {mode: 'minutes', minutes: store.settings.goal || 60, date: dayKey(new Date(Date.now() + 30 * 864e5)), days: [1, 2, 3, 4, 5, 6, 0]};
  const pr = ownerProgress(o), n = pr.total - pr.done;
  openModal(`<h2>📅 Study plan</h2><p class="muted" style="margin:0">${o.order ? '📚 ' : ''}${esc(o.title)} · ${fmt(pr.left)} left in ${n} ${n === 1 ? 'part' : 'chapters'}</p>
    <div class="row" style="margin-top:12px;gap:18px">
      <label class="chk" style="margin:0"><input type="radio" name="pm" value="minutes" ${p0.mode !== 'date' ? 'checked' : ''}> Study <input id="pMin" type="number" min="5" max="600" value="${p0.minutes || 60}" style="width:80px"> minutes a day</label>
      <label class="chk" style="margin:0"><input type="radio" name="pm" value="date" ${p0.mode === 'date' ? 'checked' : ''}> Finish by <input id="pDate" type="date" value="${p0.date}" min="${dayKey()}" style="width:165px"></label>
    </div>
    <label>Study days</label>
    <div class="daychips">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label><input type="checkbox" value="${d}" ${(p0.days || []).includes(d) ? 'checked' : ''}> ${DAYS[d]}</label>`).join('')}</div>
    <div id="planPreview"></div>
    <div class="actions">${o.plan ? '<button class="danger" id="pDel">Remove plan</button>' : ''}<button onclick="closeModal()">Cancel</button><button class="primary" id="pSave">Save plan</button></div>`, true);
  const read = () => ({mode: $('#modal').querySelector('input[name=pm]:checked').value, minutes: Math.min(600, Math.max(5, Math.round(+$('#pMin').value || 60))), date: $('#pDate').value || dayKey(), days: [...$('#modal').querySelectorAll('.daychips input:checked')].map(x => +x.value)});
  // redraw only when the settings really changed, so leaving a box (change event) never swaps a button out mid-click
  let drawn = '';
  const draw = force => {
    const p = read(), k = JSON.stringify(p);
    if(force !== true && k === drawn) return;
    drawn = k; $('#planPreview').innerHTML = planTable(o, p);
    const sb = $('#pSplit');
    if(sb) sb.onclick = () => { const n = splitLong(o, computePlan(o, read()).budget); if(n){ save(); render(); toast(`✂️ Split ${n} lecture${n > 1 ? 's' : ''} into parts. Plan updated`); } draw(true); };
  };
  $('#pMin').onfocus = () => { $('#modal').querySelector('input[value=minutes]').checked = true; draw(); };
  $('#pDate').onfocus = () => { $('#modal').querySelector('input[value=date]').checked = true; draw(); };
  $('#modal').querySelectorAll('input').forEach(x => { x.addEventListener('input', draw); x.addEventListener('change', draw); });
  draw();
  $('#pSave').onclick = () => { const p = read(); if(!p.days.length){ toast('Pick at least one study day'); return; } o.plan = p; o.planToday = null; save(); closeModal(); render(); toast("📅 Plan saved. Home shows today's part"); };
  if($('#pDel')) $('#pDel').onclick = () => { delete o.plan; delete o.planToday; save(); closeModal(); render(); toast('Plan removed'); };
}

// ================= search =================
let sresults = [], ssel = 0;
function searchAll(q){
  q = q.trim().toLowerCase(); if(q.length < 2) return [];
  const res = [];
  for(const v of store.videos){
    const o = courseOf(v), where = (o ? `📚 ${o.title} · L${courseVideos(o).indexOf(v) + 1} · ` : '') + v.title;
    if(v.title.toLowerCase().includes(q)) res.push({v, i: resumeIdx(v), label: '🎬 ' + v.title, where: o ? '📚 ' + o.title : 'Video'});
    for(const c of chapters(v)){
      if(c.title.toLowerCase().includes(q)) res.push({v, i: c.idx, label: `${c.idx + 1}. ${c.title}`, where});
      const n = v.notes[c.key], at = n ? n.toLowerCase().indexOf(q) : -1;
      if(at >= 0) res.push({v, i: c.idx, label: '📝 …' + n.slice(Math.max(0, at - 30), at + 60).replace(/\s+/g, ' ') + '…', where: where + ' › ' + c.title});
      if(res.length >= 60) return res;
    }
  }
  return res;
}
function drawSearch(){
  const box = $('#sres'), q = $('#q').value; sresults = searchAll(q); ssel = 0;
  if(q.trim().length < 2){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = sresults.length ? sresults.map((r, i) => `<div class="r ${i === ssel ? 'sel' : ''}" data-r="${i}">${esc(r.label)}<small>${esc(r.where)}</small></div>`).join('') : '<div class="r muted">No matches</div>';
  box.querySelectorAll('[data-r]').forEach(el => el.onmousedown = e => { e.preventDefault(); pickSearch(+el.dataset.r); });
}
function pickSearch(i){
  const r = sresults[i]; if(!r) return;
  $('#sres').hidden = true; $('#q').value = ''; $('#q').blur();
  openVideo(r.v.id); playChapter(r.i, false);
}
$('#q').oninput = drawSearch;
$('#q').onfocus = drawSearch;
$('#q').onblur = () => setTimeout(() => { $('#sres').hidden = true; }, 150);
$('#q').onkeydown = e => {
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if(!sresults.length) return; ssel = (ssel + (e.key === 'ArrowDown' ? 1 : -1) + sresults.length) % sresults.length; $('#sres').querySelectorAll('[data-r]').forEach((el, i) => el.classList.toggle('sel', i === ssel)); }
  if(e.key === 'Enter'){ e.preventDefault(); pickSearch(ssel); }
  if(e.key === 'Escape'){ $('#q').value = ''; $('#sres').hidden = true; $('#q').blur(); }
};

// ================= notes download =================
function downloadNotes(o){
  let md = `# ${o.title}\n\n`, n = 0;
  ownerVideos(o).forEach((v, i) => {
    const keys = Object.keys(v.notes || {}).filter(k => (v.notes[k] || '').trim());
    if(!keys.length) return;
    md += `## ${o.order ? `L${i + 1} · ` : ''}${v.title}\n\n`;
    keys.sort((a, b) => (a === 'w' ? -1 : +a) - (b === 'w' ? -1 : +b)).forEach(k => {
      const ci = v.chapters.findIndex(c => String(c.start) === k);
      const title = k === 'w' ? 'Whole video' : !v.chapters.length ? 'Full video' : ci >= 0 ? `${ci + 1}. ${v.chapters[ci].title} (${fmt(+k)})` : `At ${fmt(+k)}`;
      md += `### ${title}\n\n${v.notes[k].trim()}\n\n`; n++;
    });
  });
  if(!n){ toast('No notes yet. Write some in the notes box under the video'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md], {type: 'text/markdown'}));
  a.download = (o.title.replace(/[^\w\- ]+/g, '').trim().slice(0, 60).replace(/\s+/g, '-') || 'chapterbox') + '-notes.md';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Downloaded ${n} note${n > 1 ? 's' : ''}`);
}

// ================= YouTube player =================
let player = null, playerReady = false, pending = null;

function loadIntoPlayer(v, start, end, autoplay){
  if(ytMode === 'file' || ytMode === 'blocked'){ showOverlay(ytMode, v, start); return; }
  hideOverlay();
  if(ytMode === 'plain'){ plainEmbed(v, start, end, autoplay); return; }
  if(ytMode === 'loading'){ pending = {v, start, end, autoplay}; return; }
  if(!player){ createPlayer(v, start, autoplay); return; }
  if(!playerReady){ pending = {v, start, end, autoplay}; return; }
  try{
    const data = player.getVideoData ? player.getVideoData() : null;
    const st = player.getPlayerState();
    if(data && data.video_id === v.ytId && [0, 1, 2, 3].includes(st)){
      // same video already playing: just jump inside it, so YouTube doesn't start new ads
      adGuard = null; player.seekTo(start, true);
      if(autoplay) player.playVideo(); else player.pauseVideo();
    } else {
      const opts = {videoId: v.ytId, startSeconds: Math.floor(start)};
      adGuard = start; autoplay ? player.loadVideoById(opts) : player.cueVideoById(opts);
    }
  }catch(e){}
}
function resetPlayerBox(){
  try{ if(player && player.destroy) player.destroy(); }catch(e){}
  player = null; playerReady = false;
  $('#playerbox').innerHTML = '<div id="player"></div>';
}
function createPlayer(v, start, autoplay){
  resetPlayerBox(); adGuard = start;
  const vars = {start: Math.floor(start), rel: 0, playsinline: 1, autoplay: autoplay ? 1 : 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3};
  player = new YT.Player('player', {videoId: v.ytId, width: '100%', height: '100%', playerVars: vars,
    events: {onReady, onStateChange, onError}});
}
function plainEmbed(v, start, end, autoplay){
  const src = `https://www.youtube.com/embed/${v.ytId}?start=${Math.floor(start)}${end != null ? '&end=' + Math.ceil(end) : ''}&autoplay=${autoplay ? 1 : 0}&rel=0&playsinline=1`;
  $('#playerbox').innerHTML = `<iframe src="${src}" title="YouTube player" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
}
function onReady(){
  playerReady = true; applySpeed();
  if(pending){ const p = pending; pending = null; loadIntoPlayer(p.v, p.start, p.end, p.autoplay); }
}
function onStateChange(e){
  if(e.data !== YT.PlayerState.ENDED) return;
  const v = cur(); if(!v) return;
  const c = curChapter(v);
  markDone(v, c.key); save();
  renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow();
  if(c.idx === chapters(v).length - 1){ if(store.settings.autoNext && nextLecture(v)) goNextLecture(v); else toast('🎉 That was the last chapter!'); }
}
let advancing = null;
function goNextLecture(v){
  const nx = nextLecture(v); if(!nx || advancing === v.id) return;
  advancing = v.id; try{ player.pauseVideo(); }catch(e){}
  toast(`🎉 Lecture done! Next: ${nx.title.slice(0, 50)}`);
  setTimeout(() => { if(cur() === v){ openVideo(nx.id); playChapter(curChapter(nx).idx, true); } }, 1500);
}
function onError(e){
  const v = cur(); if(!v) return;
  const t = playerTime() ?? resumePoint(v).start;
  showOverlay(e.data === 101 || e.data === 150 ? 'embedoff' : (e.data === 153 ? '153' : 'other'), v, t, e.data);
}
function playerTime(){
  if(ytMode !== 'api' || !player || !playerReady) return null;
  try{ const t = player.getCurrentTime(); return typeof t === 'number' ? t : null; }catch(e){ return null; }
}

function showOverlay(kind, v, t, code){
  hideOverlay(); if(!v) return;
  const msgs = {
    file: `YouTube won't play on a page opened by double-click. Open your online ChapterBox link instead.`,
    blocked: `This preview blocks YouTube. Open your online ChapterBox link in a normal browser tab.`,
    embedoff: `The owner of this video doesn't allow it to play on other sites.`,
    '153': `YouTube refused to play here (Error 153). Open your online ChapterBox link in a normal browser tab.`,
    other: `YouTube player error${code ? ' ' + code : ''}. Try again, or watch this part on YouTube.`
  };
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'overlay';
  o.style.backgroundImage = `linear-gradient(#000000d0,#000000d0),url(${thumb(v.ytId)})`;
  o.innerHTML = `<p><b>${msgs[kind]}</b></p>
    <a class="btn primary" href="${watchUrl(v.ytId, t)}" target="_blank" rel="noopener">▶ Watch this chapter on YouTube</a>
    <p class="muted" style="font-size:12px">Chapters, ✓ marks and notes still work here.</p>`;
  $('#playerbox').appendChild(o);
}
function hideOverlay(){ const o = $('#overlay'); if(o) o.remove(); }

// 4 times a second: follow the video, tick finished chapters, move on or stop at chapter ends
let lastSave = 0, heldAt = null, adGuard = null;
// YouTube ads report their own time and length; spot them so they never move your chapter
function inAd(v){
  try{
    const d = player.getDuration(), t = player.getCurrentTime();
    if(v.duration && d > 0 && Math.abs(d - v.duration) > 5) return true;
    if(adGuard != null && adGuard > 3 && t < adGuard - 3) return true;
    if(adGuard != null && t >= adGuard - 3 && player.getPlayerState() === 1) adGuard = null;
  }catch(e){}
  return false;
}
let lastTick = Date.now();
setInterval(() => {
  const nowT = Date.now(), dt = Math.min(1.5, (nowT - lastTick) / 1000); lastTick = nowT;
  renderBar();
  const v = cur(); if(ytMode !== 'api' || !v || !player || !playerReady) return;
  let st, data; try{ st = player.getPlayerState(); data = player.getVideoData ? player.getVideoData() : null; }catch(e){ return; }
  if(!(data && data.video_id === v.ytId) || inAd(v)) return;
  try{
    const d = player.getDuration();
    const lastStart = v.chapters.length ? v.chapters[v.chapters.length - 1].start : 0;
    // learn the length as soon as the video is cued (state 5, before any ad) or while it plays
    if((st === 1 || st === 2 || st === 5) && d > lastStart && (!v.duration || Math.abs(v.duration - d) > 2)){
      v.duration = Math.round(d);
      if(!(v.autoSplit && !v.chapters.length)){ save(); renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow(); }
    }
    if(v.autoSplit && !v.chapters.length && v.duration){ v.chapters = autoSplit(v.duration, v.autoSplit); delete v.autoSplit; v.lastChapter = 0; save(); render(); }
    if(data.title && !v.titleSet){ v.title = data.title; v.titleSet = true; save(); renderLibrary(); renderTitlebar(); }
  }catch(e){}
  if(st !== 1) return;
  applySpeed(); statDay().s += dt;
  const t = playerTime(); if(t == null) return;
  v.lastTime = t;
  const chs = chapters(v); const c = curChapter(v);
  if(c.end != null && t >= c.end - 0.25 && t < c.end + 2.5){
    // reached the end of this chapter
    markDone(v, c.key);
    if(c.idx < chs.length - 1 && (store.settings.autoNext || heldAt === c.start)){
      heldAt = null; v.lastChapter = c.idx + 1;
      if(store.settings.autoNext) toast(`✓ Chapter ${c.idx + 1} done. Next up!`);
    } else if(c.idx === chs.length - 1 && store.settings.autoNext && nextLecture(v) && heldAt !== c.start){
      heldAt = c.start; goNextLecture(v);
    } else if(heldAt !== c.start){
      heldAt = c.start; try{ player.pauseVideo(); }catch(e){}
      toast(c.idx === chs.length - 1 ? '🎉 That was the last chapter!' : `✓ Chapter ${c.idx + 1} done. Press play or Next to continue`);
    }
    save(); renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow(); return;
  }
  if(t < c.start - 1.5 || (c.end != null && t >= c.end + 2.5)){
    // jumped around with YouTube's own controls: follow along
    const ni = chs.findIndex(x => t >= x.start && (x.end == null || t < x.end));
    if(ni >= 0 && ni !== c.idx){ heldAt = null; v.lastChapter = ni; save(); renderPlaylist(); renderNow(); }
  }
  if(Date.now() - lastSave > 4000){ lastSave = Date.now(); save(); renderPlaylist(); }
}, 250);
window.addEventListener('beforeunload', save);

// ================= chapter-only control bar =================
const SPEEDS = [1, 1.25, 1.5, 1.75, 2, 0.75];
let scrubbing = false;
function playerState(){ try{ return player && playerReady ? player.getPlayerState() : -1; }catch(e){ return -1; } }
function chapterLen(v, c){ return c.len != null ? c.len : Math.max(0, (v.duration || 0) - c.start); }
function renderBar(){
  const bar = $('#cbar'), v = cur();
  bar.hidden = !(v && ytMode === 'api'); if(bar.hidden) return;
  const c = curChapter(v), len = chapterLen(v, c), st = playerState();
  let t = playerTime(); if(t == null || st === 5 || st === -1) t = resumePoint(v).start;
  const rel = Math.min(Math.max(t - c.start, 0), len);
  if(player && playerReady && (st === 1 || st === 3 || st === -1) && inAd(v)){ $('#cFill').style.width = '0%'; $('#cTime').textContent = `Ad playing… then 0:00 / ${fmt(len)}`; }
  else if(!scrubbing){ $('#cFill').style.width = (len ? rel / len * 100 : 0) + '%'; $('#cTime').textContent = `${fmt(rel)} / ${len ? fmt(len) : '--:--'}`; }
  $('#cPlay').textContent = st === 1 || st === 3 ? '⏸' : '▶';
  $('#cSpeed').textContent = (store.settings.speed || 1) + '×';
  let muted = false; try{ muted = !!(player && playerReady && player.isMuted()); }catch(e){}
  $('#cMute').textContent = muted ? '🔇' : '🔊';
}
function applySpeed(){
  try{ const want = store.settings.speed || 1; if(player && playerReady && player.getPlaybackRate() !== want) player.setPlaybackRate(want); }catch(e){}
}
function togglePlay(){
  const v = cur(); if(!v) return; const st = playerState();
  if(st === 1 || st === 3) player.pauseVideo();
  else if(st === 2) player.playVideo();
  else playChapter(curChapter(v).idx, true, st === 0);
  setTimeout(renderBar, 80);
}
function seekInChapter(target){
  const v = cur(); const c = curChapter(v); const len = chapterLen(v, c);
  target = Math.min(Math.max(target, c.start), c.start + Math.max(0, len - 0.5));
  heldAt = null; v.lastTime = target;
  if([1, 2, 3].includes(playerState())) player.seekTo(target, true);
  else loadIntoPlayer(v, target, c.end, true);
  renderBar();
}
function scrubTo(e, commit){
  const v = cur(); if(!v) return; const c = curChapter(v), len = chapterLen(v, c); if(!len) return;
  const r = $('#cProg').getBoundingClientRect(); const f = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  $('#cFill').style.width = f * 100 + '%'; $('#cTime').textContent = `${fmt(f * len)} / ${fmt(len)}`;
  if(commit) seekInChapter(c.start + f * len);
}
$('#cPlay').onclick = togglePlay;
$('#cProg').onpointerdown = e => { scrubbing = true; $('#cProg').setPointerCapture(e.pointerId); scrubTo(e, false); };
$('#cProg').onpointermove = e => { if(scrubbing) scrubTo(e, false); };
$('#cProg').onpointerup = e => { if(!scrubbing) return; scrubbing = false; scrubTo(e, true); };
$('#cSpeed').onclick = () => {
  const n = SPEEDS[(SPEEDS.indexOf(store.settings.speed || 1) + 1) % SPEEDS.length];
  store.settings.speed = n; save(); applySpeed(); renderBar(); toast(`Speed ${n}×`);
};
$('#cMute').onclick = () => { try{ player.isMuted() ? player.unMute() : player.mute(); }catch(e){} setTimeout(renderBar, 80); };
$('#cFs').onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : $('#playerwrap').requestFullscreen(); }catch(e){} };

// keyboard shortcuts
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if(/INPUT|TEXTAREA|SELECT/.test(tag) || $('#modalBg').classList.contains('show')) return;
  if(e.key === '/'){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key === '?'){ e.preventDefault(); helpModal(); return; }
  if(!cur() || view !== 'watch') return;
  const i = curChapter(cur()).idx;
  if(e.shiftKey){
    if(e.key === 'N'){ e.preventDefault(); playChapter(i + 1, true, true); }
    if(e.key === 'P'){ e.preventDefault(); playChapter(i - 1, true, true); }
    if(e.key === 'D'){ e.preventDefault(); toggleDone(i); }
    if(e.key === 'S'){ e.preventDefault(); toggleStar(i); }
    return;
  }
  if(e.key === ' ' || e.key === 'k'){ e.preventDefault(); togglePlay(); }
  if((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && ytMode === 'api'){
    const t = playerTime(); if(t == null) return;
    e.preventDefault(); seekInChapter(t + (e.key === 'ArrowRight' ? 5 : -5));
  }
  if(e.key === 'f'){ e.preventDefault(); $('#cFs').click(); }
  if(e.key === 'm'){ e.preventDefault(); $('#cMute').click(); }
});

// load the YouTube player API (not on double-clicked files: YouTube rejects those)
function currentRequest(){ const v = cur(); if(!v) return null; const r = resumePoint(v); return {v, start: r.start, end: r.end, autoplay: false}; }
function apiFail(){
  if(ytMode !== 'loading') return;
  ytMode = (IS_LOCALHOST || !IS_FRAMED) ? 'plain' : 'blocked';
  renderBanner(); renderPlayerNote();
  const p = pending || currentRequest(); pending = null;
  if(p) loadIntoPlayer(p.v, p.start, p.end, false);
}
window.onYouTubeIframeAPIReady = () => {
  const wasFallback = ytMode !== 'loading';
  ytMode = 'api'; renderBanner(); renderPlayerNote();
  if(wasFallback) resetPlayerBox();
  const p = pending || currentRequest(); pending = null;
  if(p) loadIntoPlayer(p.v, p.start, p.end, p.autoplay);
};
function loadYouTubeApi(){
  if(IS_FILE) return;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
  s.onerror = apiFail; document.head.appendChild(s);
  setTimeout(() => { if(ytMode === 'loading') apiFail(); }, 10000);
}

// start
applyTheme();
window.addEventListener('hashchange', async () => { if(await readShareHash()) openVideo(store.currentId); });
renderBanner();
render();
loadYouTubeApi();
readShareHash().then(added => { if(added && cur()) openVideo(store.currentId); else render(); });
</script>
