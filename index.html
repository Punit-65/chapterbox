<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ChapterBox — split long lectures into chapter videos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff4e45'/><path d='M40 30v40l32-20z' fill='white'/></svg>">
<style>
:root{--bg:#0f0f0f;--panel:#181818;--panel2:#222;--line:#2f2f2f;--text:#f1f1f1;--muted:#a3a3a3;--accent:#ff4e45;--good:#2ecc71;--active:#263238;--warn:#ffb74d;--input:#121212;--hover:#2d2d2d;--card:#141414;--track:#333;--chip:#262626}
[data-theme="light"]{--bg:#f6f7f9;--panel:#fff;--panel2:#eef0f3;--line:#dfe2e7;--text:#16181d;--muted:#5f6670;--active:#e7f0ff;--warn:#b26a00;--input:#fff;--hover:#eceef2;--card:#fafbfc;--track:#dde1e6;--chip:#eceef2}
[data-theme="light"] .setup{background:#eef3ff;border-color:#c9d6f5}
[data-theme="light"] .setup.warn{background:#fff5e6;border-color:#f1d4a6}
[data-theme="light"] .toast{background:#16181d;color:#fff}
[data-theme="light"] .ch.done .t{color:#1e8e4f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,a.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,a.btn:hover{background:var(--hover)}
button:disabled{opacity:.45;cursor:default}
button.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover,a.btn.primary:hover{filter:brightness(1.08)}
button.danger{color:#ff8a80}
button.danger-fill{background:#c62828;border-color:#c62828;color:#fff;font-weight:600}
button.small{padding:4px 9px;font-size:12px}
input,textarea{font:inherit;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus{outline:2px solid #3d6bff55;border-color:#3d6bff}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px;margin-right:6px;cursor:pointer}
.logo span{color:var(--accent)}
.spacer{flex:1}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 55px)}
aside{border-right:1px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 55px);position:sticky;top:55px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 4px 10px}
.lib-item{display:flex;gap:10px;padding:8px;border-radius:10px;cursor:pointer;align-items:flex-start}
.lib-item:hover{background:var(--panel)}
.lib-item.active{background:var(--active)}
.lib-thumb{width:96px;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#4a1f1d,#1d2b3d)}
.lib-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lib-title{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:4px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.green>i{background:var(--good)}
main{padding:16px;min-width:0}
.setup{background:#1b1f2a;border:1px solid #33415c;border-radius:12px;padding:16px 18px;margin-bottom:16px}
.setup.warn{background:#2a2216;border-color:#5c4a2a}
.setup h3{margin:0 0 6px;font-size:16px}
.setup p{margin:6px 0}
.setup ol{margin:8px 0;padding-left:20px}
.setup li{margin:4px 0}
.setup textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#cfd8dc;margin-top:8px}
.pill{display:inline-block;background:#3d6bff;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.empty{max-width:560px;margin:50px auto;text-align:center}
.empty h1{font-size:26px;margin:0 0 8px}
.steps{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px 14px 34px;margin:20px 0}
.steps li{margin:6px 0}
.titlebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.titlebar h2{margin:0;font-size:20px;flex:1;min-width:200px;cursor:text}
.titlebar h2:hover{text-decoration:underline dotted #666}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.playerbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.playerwrap{background:#000;border-radius:12px;overflow:hidden}
.cbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#141414}
.cbar[hidden]{display:none}
.cbar button{background:transparent;border:0;padding:5px 8px;font-size:15px;line-height:1}
.cbar button:hover{background:#2a2a2a}
.ctime{font-variant-numeric:tabular-nums;font-size:13px;color:#ddd;white-space:nowrap}
.cprog{flex:1;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none;margin:0 6px}
.ctrack{position:relative;width:100%;height:5px;background:#3a3a3a;border-radius:3px}
.cprog:hover .ctrack{height:7px}
.cfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:3px}
#cSpeed{font-size:13px;font-weight:700;min-width:46px}
.course{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--card)}
.course-head{padding:8px;cursor:pointer;border-radius:8px}
.course-head:hover{background:var(--panel)}
.course-head b{font-size:13px}
.caret{color:var(--muted);display:inline-block;width:12px}
.lnum{color:var(--accent);font-weight:800;font-size:11px}
.crumb{width:100%;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pl-way{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.pl-way ol{margin:8px 0;padding-left:20px}
.pl-way li{margin:6px 0}
a.bmk{cursor:grab}
#homeBtn.on{background:var(--active)}
.search{position:relative;flex:1;max-width:440px;margin-left:6px}
.search input{border-radius:999px;padding:7px 14px}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:60vh;overflow:auto;z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.sres[hidden]{display:none}
.sres .r{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.sres .r:hover,.sres .r.sel{background:var(--hover)}
.sres .r small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.menu.pop{position:absolute;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;min-width:210px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.menu.pop button{background:transparent;border:0;justify-content:flex-start;padding:8px 10px;width:100%}
.menu.pop button:hover{background:var(--hover)}
.home{max-width:1100px}
.hello h1{margin:0 0 4px;font-size:26px}
.hello p{margin:0}
.cont{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;cursor:pointer}
.cont:hover{border-color:var(--accent)}
.cont img{width:220px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .big{font-size:24px;font-weight:800}
.stat .big small{font-size:13px;color:var(--muted);font-weight:600}
#goalCard{cursor:pointer}
.week{display:flex;gap:8px;align-items:flex-end;height:130px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.week .b{width:100%;max-width:40px;background:var(--accent);border-radius:6px 6px 2px 2px}
.week .d.today{color:var(--text);font-weight:700}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
.sec-h h2{margin:0;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .ct{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#4a1f1d,#1d2b3d)}
.card .ct img{width:100%;height:100%;object-fit:cover;display:block}
.card .ct .badge{position:absolute;right:8px;bottom:8px;background:#000c;color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.card .cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .cb b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plan-today{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.pt-item{display:flex;gap:6px;align-items:center;padding:5px 0;font-size:13px;cursor:pointer;border-bottom:1px dashed var(--line)}
.pt-item:last-of-type{border-bottom:0}
.pt-item:hover{color:var(--accent)}
.pt-item.done{color:var(--muted);text-decoration:line-through}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chips button{padding:3px 10px;font-size:12px;border-radius:999px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.starbtn{position:absolute;right:6px;top:6px;width:24px;height:24px;border:0;background:transparent;padding:0;font-size:14px;opacity:.35;justify-content:center}
.ch:hover .starbtn,.starbtn.on{opacity:1}
.ch.hide{display:none}
#nStar.on{border-color:#e6b800}
.notes-tools{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.modal.wide{max-width:920px}
.plan-sum{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px}
.plan-warn{margin-top:8px;color:var(--warn)}
.plan-warn button{margin-left:6px}
.offchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.offchips span{display:inline-flex;gap:4px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 8px;font-size:13px}
.offchips span.legend{background:none;border:0;padding:0 4px;font-size:12px}
.offchips button{padding:0 6px;border:0;background:transparent;font-size:12px}
.plan-table tr.off td{color:var(--muted);font-style:italic}
.plan-today.off{border-style:dashed}
.carry{font-size:11px;color:var(--warn);margin-left:4px;white-space:nowrap}
select{font:inherit;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.dbtn{border:0;background:transparent;padding:0 3px 0 0;font-size:10px;line-height:1;cursor:pointer;vertical-align:1px}
.dots{margin-left:6px;font-size:9px;letter-spacing:1px;white-space:nowrap}
.coach{background:linear-gradient(135deg,rgba(255,78,69,.07),rgba(90,130,255,.08)),var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:16px 0}
.coach-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.coach-h .muted{font-size:12px;flex:1}
.tip{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:14px;flex-wrap:wrap}
.tip > span{font-size:18px;width:24px;text-align:center;flex:none}
.tip > div:nth-child(2){flex:1;min-width:200px}
.tip-b{display:flex;gap:6px;flex-wrap:wrap}
.revbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.rev-row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
.rev-row:last-child{border-bottom:0}
.rev-row .t{flex:1;min-width:180px;cursor:pointer}
.rev-row .t:hover{color:var(--accent)}
.ratebar{position:fixed;left:16px;bottom:16px;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.45);display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:min(470px,calc(100vw - 32px));font-size:13px}
.ratebar[hidden]{display:none}
.rate-inline{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.rate-inline button{padding:2px 7px;font-size:14px}
.rate-inline button.on{background:var(--active);border-color:var(--accent)}
.aibox{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.aiout{margin-top:8px;font-size:14px;line-height:1.55}
.aiout pre{background:var(--input);padding:8px 10px;border-radius:8px;overflow:auto;font-size:12.5px}
.aiout ul{padding-left:20px;margin:6px 0}
.aiout p{margin:6px 0}
.qq{padding:8px 0;border-bottom:1px dashed var(--line)}
.qo{display:block;width:100%;text-align:left;margin-top:6px}
.qo.right{border-color:var(--good);background:rgba(46,204,113,.16)}
.qo.wrong{border-color:var(--accent);background:rgba(255,78,69,.13)}
.why{font-size:13px;color:var(--muted);margin-top:6px}
.qscore{margin-top:8px;font-weight:700}
#focusBtn.on{background:var(--active);font-variant-numeric:tabular-nums}
.hello{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#fiveBtn{font-size:15px;padding:10px 16px}
.fivepill{position:fixed;right:16px;bottom:16px;z-index:71;background:var(--accent);color:#fff;border-radius:999px;padding:7px 8px 7px 14px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.fivepill[hidden]{display:none}
.fivepill button{background:rgba(0,0,0,.25);border:0;color:#fff;padding:2px 8px}
.trbox{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.trlist{max-height:340px;overflow:auto;margin-top:8px;font-size:14px;line-height:1.5}
.tl{display:flex;gap:10px;padding:3px 6px;border-radius:6px;cursor:pointer}
.tl:hover{background:var(--hover)}
.tl.on{background:var(--active)}
.tl .tt{color:var(--accent);font-variant-numeric:tabular-nums;flex:none;width:52px;font-size:12px;padding-top:2px}
.tl mark{background:rgba(255,213,79,.35);color:inherit;border-radius:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 12px;font-size:12px}
.seg button.on{background:var(--accent);color:#fff}
.fc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fc{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:22px;font-size:18px;line-height:1.5;min-height:120px}
.fc hr{border:0;border-top:1px dashed var(--line);margin:14px 0}
.fc p{margin:4px 0}
.cd{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cd > div{flex:1;min-width:0}
.cdp{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer}
.cdp input{width:auto;margin-top:4px}
.slice{color:var(--muted);font-size:12px}
.wkt{color:var(--muted);font-weight:400}
.sched{border-color:var(--accent)}
.sc-row{display:flex;gap:12px;align-items:baseline;padding:5px 0;font-size:13px;cursor:pointer;border-bottom:1px dashed var(--line)}
.sc-row:hover{color:var(--accent)}
.sched .sc-row:last-of-type{border-bottom:0}
.sc-t{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;min-width:150px}
.live{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.pv{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.pv:last-child{border-bottom:0}
.pv-d{flex:none;width:96px;color:var(--muted)}
@media (max-width:760px){.sc-t{min-width:0}.sc-row{flex-direction:column;gap:0}.pv{flex-direction:column;gap:2px}}
@media (max-width:760px){.fivepill{left:8px;right:8px;bottom:8px;justify-content:space-between}}
@media (max-width:760px){.ratebar{left:8px;right:8px;bottom:8px;max-width:none}.coach-h .muted{display:none}.coach-h > b{flex:1}}
.plan-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.plan-table th,.plan-table td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.plan-table th{background:var(--panel2)}
.plan-table tr.wk td{background:var(--panel2);font-weight:700}
.plan-table td.t{white-space:nowrap;font-variant-numeric:tabular-nums}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips label{margin:0;display:flex;gap:4px;align-items:center;color:var(--text);font-size:13px;background:var(--panel2);padding:4px 8px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.daychips input{width:auto}
.hero{text-align:center;max-width:740px;margin:36px auto 8px}
.hero h1{font-size:30px;margin:0 0 8px}
.hero .row{justify-content:center}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:940px;margin:26px auto}
.features div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.features span{color:var(--muted);font-size:13px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.cont{flex-direction:column;align-items:stretch}.cont img{width:100%}.features{grid-template-columns:1fr 1fr}}
.playerwrap:fullscreen{display:flex;flex-direction:column;border-radius:0}
.playerwrap:fullscreen .playerbox{flex:1;aspect-ratio:auto}
.playerbox iframe,#player{position:absolute;inset:0;width:100%;height:100%;border:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background-color:#000;background-size:cover;background-position:center}
.overlay p{max-width:540px;margin:0}
.pnote{font-size:12px;color:var(--warn);margin-top:8px}
.now{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.now-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.now h3{margin:0;font-size:17px}
.now .meta{color:var(--muted);font-size:12px;margin-top:2px}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.chk input{width:auto}
.playlist{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:71px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.pl-head{padding:12px 14px;border-bottom:1px solid var(--line)}
.pl-head b{font-size:15px}
.pl-list{overflow:auto;padding:6px}
.ch{display:flex;gap:10px;padding:6px;border-radius:10px;cursor:pointer;align-items:flex-start;position:relative}
.ch:hover{background:var(--hover)}
.ch.active{background:var(--active)}
.ch .num{width:20px;text-align:center;color:var(--muted);font-size:12px;padding-top:24px;flex:none}
.thumb{position:relative;width:132px;flex:none;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#4a1f1d,#1d2b3d)}
.thumb img{width:100%;height:100%;object-fit:cover;filter:brightness(.8);display:block}
.thumb .badge{position:absolute;right:4px;bottom:4px;background:#000c;color:#fff;font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px}

<script>
// ================= storage =================
const KEY = 'chapterbox.v1';
const diffCache = new Map();   // difficulty scores per course, rebuilt after every save
let store = loadStore();
function loadStore(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.videos)){ s.settings = Object.assign({autoNext:true}, s.settings); s.courses = Array.isArray(s.courses) ? s.courses : []; s.stats = s.stats && typeof s.stats === 'object' ? s.stats : {}; return s; }
  }catch(e){}
  return {videos:[], courses:[], stats:{}, settings:{autoNext:true}, currentId:null};
}
let saveWarned = false;
function save(){
  diffCache.clear();
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ if(!saveWarned){ toast('Could not save: browser storage is blocked here'); saveWarned = true; } }
}

// ================= where are we running? =================
const IS_FILE = location.protocol === 'file:';
const IS_LOCALHOST = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const IS_FRAMED = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
// ytMode: loading → api (full player) | plain (simple embed) | blocked (preview) ; file = opened by double-click
let ytMode = IS_FILE ? 'file' : 'loading';

// ================= helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(sec){
  sec = Math.max(0, Math.floor(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function fmtLen(sec){
  sec = Math.round(sec||0); const h = Math.floor(sec/3600), m = Math.round(sec%3600/60);
  return h ? `${h}h ${m}m` : `${Math.max(1,m)}m`;
}
function toSec(str){
  if(str == null) return null; str = String(str).trim(); if(!str) return null;
  if(/^\d+(\.\d+)?$/.test(str)) return Math.round(parseFloat(str)*60); // plain number = minutes
  const p = str.split(':').map(Number); if(p.some(isNaN) || p.length > 3) return null;
  return p.reduce((a,b) => a*60 + b, 0);
}
function ytId(s){
  s = (s||'').trim(); if(/^[\w-]{11}$/.test(s)) return s;
  try{
    const u = new URL(/^https?:\/\//.test(s) ? s : 'https://' + s);
    if(u.hostname.includes('youtu.be')) return u.pathname.slice(1, 12) || null;
    if(u.searchParams.get('v')) return u.searchParams.get('v').slice(0, 11);
    const m = u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/); if(m) return m[2];
  }catch(e){}
  return null;
}
function urlStart(s){
  try{
    const u = new URL(/^https?:\/\//.test(s) ? s : 'https://' + s); const t = u.searchParams.get('t');
    if(t){ const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/); if(m) return (+(m[1]||0))*3600 + (+(m[2]||0))*60 + (+(m[3]||0)); }
  }catch(e){}
  return 0;
}
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const watchUrl = (id, t) => `https://www.youtube.com/watch?v=${id}${t ? '&t=' + Math.floor(t) + 's' : ''}`;
const fileName = () => decodeURIComponent(location.pathname.split('/').pop() || 'chapterbox.html');

// Parse chapters. Works with description lines ("54:00 Problem 8", "Problem 8 - 54:00")
// and with YouTube's chapter panel copy (title on one line, time on the next).
function parseChapters(text){
  const out = []; let lastText = '';
  for(const raw of (text||'').split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    const m = line.match(/(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?!\d)/);
    if(!m){ lastText = line; continue; }
    const sec = (+(m[1]||0))*3600 + (+m[2])*60 + (+m[3]);
    let title = (line.slice(0, m.index) + ' ' + line.slice(m.index + m[0].length))
      .replace(/^[\s\-–—|:.,)\]•*>]+/, '').replace(/[\s\-–—|:(\[•*]+$/, '').replace(/\s+/g, ' ').trim();
    if(!title && lastText) title = lastText;
    lastText = '';
    out.push({start: sec, title});
  }
  out.sort((a,b) => a.start - b.start);
  const dedup = out.filter((c,i) => i === 0 || c.start !== out[i-1].start);
  if(dedup.length && dedup[0].start > 0) dedup.unshift({start:0, title:'Intro'});
  dedup.forEach((c,i) => { if(!c.title) c.title = `Part ${i+1}`; });
  return dedup;
}
function chaptersToText(chs){ return chs.map(c => `${fmt(c.start)} ${c.title}`).join('\n'); }
function autoSplit(duration, minutes){
  const step = Math.max(1, minutes) * 60, out = [];
  for(let t = 0, i = 1; t < duration - 30; t += step, i++) out.push({start:t, title:`Part ${i}`});
  return out;
}

// chapters with computed end times
// a video (or a whole playlist) can be played whole, without its chapters; done/notes keys: chapter start, or 'w' for whole
function isWhole(v){ const c = v.course ? store.courses.find(x => x.id === v.course) : null; return c ? !!c.whole : !!v.whole; }
function chapters(v){
  const has = !!(v.chapters && v.chapters.length), whole = !has || isWhole(v);
  const list = whole ? [{start: 0, title: has ? 'Whole video' : 'Full video'}] : v.chapters;
  return list.map((c, i) => {
    const end = i < list.length - 1 ? list[i + 1].start : (v.duration || null);
    return {...c, idx: i, key: whole ? (has ? 'w' : 0) : c.start, end, len: end != null ? end - c.start : null};
  });
}
const cur = () => store.videos.find(v => v.id === store.currentId) || null;
function progressOf(v){ const chs = chapters(v); const d = chs.filter(c => v.done[c.key]).length; return {done:d, total:chs.length}; }
function curChapter(v){ const chs = chapters(v); return chs[Math.min(Math.max(v.lastChapter ?? 0, 0), chs.length - 1)]; }
function resumePoint(v){
  const c = curChapter(v);
  const t = v.lastTime;
  const start = (t != null && t >= c.start && (c.end == null || t < c.end - 2)) ? t : c.start;
  return {start, end: c.end};
}

// ================= toast & modals =================
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function openModal(html, wide){ $('#modal').classList.toggle('wide', !!wide); $('#modal').innerHTML = html; $('#modalBg').classList.add('show'); const f = $('#modal').querySelector('input,textarea'); if(f) setTimeout(() => f.focus(), 30); }
function closeModal(){ $('#modalBg').classList.remove('show'); }
$('#modalBg').addEventListener('mousedown', e => { if(e.target.id === 'modalBg') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
function confirmModal(title, bodyHtml, okLabel, onOk){
  openModal(`<h2>${esc(title)}</h2><p class="muted">${bodyHtml}</p>
    <div class="actions"><button onclick="closeModal()">Cancel</button><button class="danger-fill" id="okBtn">${esc(okLabel)}</button></div>`);
  $('#okBtn').onclick = () => { closeModal(); onOk(); };
  setTimeout(() => $('#okBtn').focus(), 30);
}
async function copyLink(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); return; }catch(e){}
  openModal(`<h2>Copy this link</h2><textarea id="linkBox" rows="4" readonly>${esc(text)}</textarea>
    <div class="actions"><button class="primary" onclick="closeModal()">Done</button></div>`);
  setTimeout(() => { const t = $('#linkBox'); t.focus(); t.select(); }, 40);
}

// ================= share links & playlists =================
// #addz= carries compressed {p: {id, t}, v: [{y, t, d, c: [[start, title], ...]}]}; old #add= links carry one video
const b64u = bytes => { let bin = ''; for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = str => { str = str.replace(/-/g, '+').replace(/_/g, '/'); while(str.length % 4) str += '='; return Uint8Array.from(atob(str), ch => ch.charCodeAt(0)); };
async function packZ(obj){ return b64u(new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())); }
async function unpackZ(str){ return JSON.parse(await new Response(new Blob([unb64u(str)]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()); }
const courseOf = v => v && v.course ? store.courses.find(c => c.id === v.course) || null : null;
function courseVideos(c){ return c.order.map(y => store.videos.find(v => v.ytId === y && v.course === c.id)).filter(Boolean); }
function nextLecture(v){ const c = courseOf(v); if(!c) return null; const l = courseVideos(c); return l[l.indexOf(v) + 1] || null; }
async function shareLink(v){
  const one = x => ({y: x.ytId, t: x.title, d: x.duration || 0, c: x.chapters.map(c => [c.start, c.title])});
  const c = courseOf(v);
  const data = c ? {p: {id: c.id, t: c.title}, v: courseVideos(c).map(one)} : {v: [one(v)]};
  return location.origin + location.pathname + '#addz=' + await packZ(Object.assign(data, {s: 1}));
}
function cleanChapters(c){
  return (Array.isArray(c) ? c : []).filter(x => Array.isArray(x) && typeof x[0] === 'number')
    .map(x => ({start: Math.max(0, Math.floor(x[0])), title: String(x[1] || '').slice(0, 200)}))
    .sort((p, q) => p.start - q.start).filter((x, i, a) => i === 0 || x.start !== a[i - 1].start);
}
function importLectures(list, p, autoSplitMin){
  let course = null;
  if(p && p.id){
    course = store.courses.find(c => c.id === String(p.id));
    if(!course){ course = {id: String(p.id).slice(0, 100), title: String(p.t || 'Playlist').slice(0, 200), order: []}; if(store.settings.importWhole) course.whole = true; store.courses.push(course); }
    else if(p.t) course.title = String(p.t).slice(0, 200);
  }
  const vids = []; let trN = 0;
  list.forEach((d, i) => {
    if(!d || !/^[\w-]{11}$/.test(d.y)) return;
    const c = cleanChapters(d.c);
    let v = store.videos.find(x => x.ytId === d.y);
    if(v){ if(c.length) v.chapters = c; if(d.d) v.duration = d.d; if(d.t && !v.titleSet){ v.title = String(d.t).slice(0, 200); v.titleSet = true; } }
    else {
      v = {id: 'v' + Date.now().toString(36) + i, ytId: d.y, title: String(d.t || 'Untitled video').slice(0, 200), titleSet: !!d.t,
        duration: d.d || null, chapters: c, done: {}, notes: {}, lastChapter: 0, lastTime: 0, added: Date.now()};
      if(!course && store.settings.importWhole) v.whole = true;
      store.videos.push(v);
    }
    if(!v.chapters.length && autoSplitMin){ if(v.duration) v.chapters = autoSplit(v.duration, autoSplitMin); else v.autoSplit = autoSplitMin; }
    if(course) v.course = course.id;
    if(d.tr && Array.isArray(d.tr.s) && d.tr.s.length && trSaveNew(v, d.tr)) trN++;
    vids.push(v);
  });
  if(course) course.order = vids.map(v => v.ytId).concat(course.order.filter(y => !vids.some(v => v.ytId === y)));
  const target = vids.find(v => progressOf(v).done < progressOf(v).total) || vids[0];
  if(target) store.currentId = target.id;
  save();
  const n = vids.reduce((a, v) => a + chapters(v).length, 0);
  toast((course ? `Added "${course.title}": ${vids.length} lecture${vids.length === 1 ? '' : 's'}, ${n} chapter${n === 1 ? '' : 's'}` : vids.length ? `Added "${vids[0].title}" with ${n} chapter${n === 1 ? '' : 's'}` : 'Nothing to add') + (trN ? ' + transcript 📜' : ''));
  return vids.length > 0;
}
// bookmarks dragged before transcripts existed send no version: suggest the new one, once
function oldBookmarkTip(d){
  if(d.bv || d.s || store.settings.bmTip) return;
  store.settings.bmTip = true; save();
  setTimeout(() => toast('📥 Tip: drag the new Grab chapters bookmark again (+ Add → Playlist). It also brings transcripts'), 4500);
}
// a grab with a transcript arrives as a message from the YouTube tab (a link that long can break)
function receiveGrab(){
  if(location.hash !== '#recv') return;
  history.replaceState(null, '', location.pathname + location.search);
  if(!window.opener) return;
  const onMsg = async e => {
    if(!/^https:\/\/((www|m)\.)?youtube\.com$/.test(e.origin) || !e.data || e.data.chapterbox !== 'addz' || typeof e.data.z !== 'string') return;
    window.removeEventListener('message', onMsg);
    try{ const d = await unpackZ(e.data.z); if(importLectures(Array.isArray(d.v) ? d.v : [d], d.p)){ oldBookmarkTip(d); if(cur()) openVideo(store.currentId); } }
    catch(err){ toast("Couldn't read what the bookmark sent. Try it once more"); }
  };
  window.addEventListener('message', onMsg);
  try{ window.opener.postMessage({chapterbox: 'ready'}, '*'); }catch(e){}
}
async function readShareHash(){
  const m = location.hash.match(/^#(addz|add)=([\w-]+)$/); if(!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  try{
    const d = m[1] === 'addz' ? await unpackZ(m[2]) : JSON.parse(new TextDecoder().decode(unb64u(m[2])));
    const added = importLectures(Array.isArray(d.v) ? d.v : [d], d.p);
    if(added && m[1] === 'addz') oldBookmarkTip(d);
    return added;
  }catch(e){ toast('That ChapterBox link looks broken'); return false; }
}
function playlistId(str){
  str = (str || '').trim();
  try{ const u = new URL(/^https?:\/\//.test(str) ? str : 'https://' + str); const l = u.searchParams.get('list'); if(l) return l; }catch(e){}
  return /^(PL|UU|OL|FL)[\w-]{10,}$/.test(str) ? str : null;
}
function playlistIdsViaApi(list){
  return new Promise((resolve, reject) => {
    const holder = document.createElement('div'); holder.style.cssText = 'position:fixed;left:-9999px;top:0;width:320px;height:180px';
    const inner = document.createElement('div'); holder.appendChild(inner); document.body.appendChild(holder);
    let p = null; const done = (ids, err) => { clearTimeout(tm); try{ p.destroy(); }catch(e){} holder.remove(); ids ? resolve(ids) : reject(err); };
    const tm = setTimeout(() => done(null, new Error('timeout')), 20000);
    p = new YT.Player(inner, {width: 320, height: 180, playerVars: {listType: 'playlist', list, autoplay: 0, controls: 0},
      events: {onReady: () => { let n = 30; const tick = () => { const l = p.getPlaylist && p.getPlaylist(); if(l && l.length) done(l); else if(n-- > 0) setTimeout(tick, 500); else done(null, new Error('empty')); }; tick(); },
        onError: () => done(null, new Error('error'))}});
  });
}
function durationsViaApi(ids, onp){
  return new Promise(resolve => {
    const out = ids.map(() => 0);
    if(!ids.length){ resolve(out); return; }
    const holder = document.createElement('div'); holder.style.cssText = 'position:fixed;left:-9999px;top:0;width:320px;height:180px';
    const inner = document.createElement('div'); holder.appendChild(inner); document.body.appendChild(holder);
    let p = null, i = 0, since = Date.now(), over = false;
    const finish = () => { if(over) return; over = true; clearTimeout(all); try{ p.destroy(); }catch(e){} holder.remove(); resolve(out); };
    const all = setTimeout(finish, 15000 + ids.length * 1500);
    const next = () => { i++; since = Date.now(); if(onp) onp(i, ids.length); if(i >= ids.length) finish(); else p.cueVideoById({videoId: ids[i]}); };
    const poll = () => {
      if(over) return;
      try{ const d = p.getDuration(), data = p.getVideoData();
        if(data && data.video_id === ids[i] && d > 0){ out[i] = Math.round(d); next(); }
        else if(Date.now() - since > 4000) next();
      }catch(e){ if(Date.now() - since > 4000) next(); }
      setTimeout(poll, 100);
    };
    p = new YT.Player(inner, {width: 320, height: 180, videoId: ids[0], playerVars: {autoplay: 0, controls: 0},
      events: {onReady: poll, onError: () => { since = 0; }}});
  });
}
async function oembedTitle(url){
  try{ const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url)); return r.ok ? (await r.json()).title : null; }catch(e){ return null; }
}

// The "Grab chapters" bookmark. It runs on youtube.com (never on this page), reads the chapters YouTube
// already shows for each lecture, and opens ChapterBox with them. No comments inside: it becomes a bookmark.
async function grabber(APP){
  const u = new URL(location.href);
  const list = u.searchParams.get('list'), vid = u.searchParams.get('v');
  if(!/(^|\.)youtube\.com$/.test(u.hostname) || (!list && !vid)){ alert('Open a YouTube video or playlist first, then click this bookmark.'); return; }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;z-index:2147483647;top:14px;right:14px;max-width:340px;background:#ff4e45;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:12px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45)';
  const say = t => { box.textContent = 'ChapterBox: ' + t; };
  document.body.appendChild(box); say('starting…');
  const grab = (html, name) => { const i = html.indexOf(name + ' = '); if(i < 0) return null; const a = html.indexOf('{', i); const b = html.indexOf(';<\/script>', a); try{ return JSON.parse(html.slice(a, b)); }catch(e){ return null; } };
  const find = (o, key, out) => { out = out || []; if(o && typeof o === 'object'){ if(o[key]) out.push(o[key]); for(const k in o) find(o[k], key, out); } return out; };
  const txt = t => !t ? '' : typeof t === 'string' ? t : (t.content || t.simpleText || (t.runs || []).map(r => r.text).join(''));
  const page = async path => (await fetch(path, {credentials: 'include'})).text();
  try{
    let items = [], ptitle = '';
    if(list && !/^RD/.test(list)){
      say('reading the playlist…');
      const pd = grab(await page('/playlist?list=' + encodeURIComponent(list)), 'ytInitialData');
      ptitle = (pd && pd.header && pd.header.pageHeaderRenderer && pd.header.pageHeaderRenderer.pageTitle) || txt(pd && pd.metadata && pd.metadata.playlistMetadataRenderer && pd.metadata.playlistMetadataRenderer.title) || 'Playlist';
      items = find(pd, 'lockupViewModel').filter(l => l.contentType === 'LOCKUP_CONTENT_TYPE_VIDEO').map(l => ({y: l.contentId, t: txt(l.metadata && l.metadata.lockupMetadataViewModel && l.metadata.lockupMetadataViewModel.title)}));
      if(!items.length) items = find(pd, 'playlistVideoRenderer').map(v => ({y: v.videoId, t: txt(v.title)}));
      const seen = {}; items = items.filter(x => x.y && !seen[x.y] && (seen[x.y] = 1));
    }
    if(!items.length && vid) items = [{y: vid, t: ''}];
    if(!items.length) throw new Error('no videos found on this page');
    let n = 0; const queue = items.slice();
    const one = async it => {
      const html = await page('/watch?v=' + it.y);
      const wd = grab(html, 'ytInitialData'); const seen = {};
      it.c = find(wd, 'chapterRenderer').map(c => [Math.round(c.timeRangeStartMillis / 1000), txt(c.title)]).filter(c => !seen[c[0]] && (seen[c[0]] = 1)).sort((a, b) => a[0] - b[0]);
      const len = html.match(/"lengthSeconds":"(\d+)"/); it.d = len ? +len[1] : 0;
      if(!it.t){ const tm = html.match(/"videoDetails":\{"videoId":"[^"]*","title":"((?:[^"\\]|\\.)*)"/); try{ it.t = tm ? JSON.parse('"' + tm[1] + '"') : ''; }catch(e){ it.t = ''; } }
      n++; say('getting chapters ' + n + '/' + items.length + '…');
    };
    await Promise.all([0, 1, 2].map(async () => { while(queue.length){ const it = queue.shift(); try{ await one(it); }catch(e){ it.c = it.c || []; } } }));
    if(vid){
      const segs = () => [...document.querySelectorAll('ytd-transcript-segment-renderer')];
      const flexy = document.querySelector('ytd-watch-flexy'), onPage = (flexy && flexy.getAttribute('video-id')) || vid;
      if(onPage === vid){
        say('reading the transcript…');
        if(!segs().length){
          const ex = document.querySelector('#description-inline-expander #expand, tp-yt-paper-button#expand'); if(ex) ex.click();
          let tb = null;
          for(let k = 0; k < 16 && !(tb = document.querySelector('ytd-video-description-transcript-section-renderer button')); k++) await new Promise(r => setTimeout(r, 300));
          if(tb){ tb.click(); for(let k = 0; k < 30 && !segs().length; k++) await new Promise(r => setTimeout(r, 400)); }
        }
        const tr = segs().map(el => [((el.querySelector('.segment-timestamp') || {}).textContent || '').trim().split(':').reduce((a, x) => a * 60 + (+x || 0), 0), ((el.querySelector('.segment-text') || {}).textContent || '').trim()]).filter(x => x[1]);
        const it = items.find(x => x.y === vid);
        if(tr.length && it) it.tr = {lang: ((document.querySelector('ytd-transcript-footer-renderer') || {}).innerText || '').trim().split('\n')[0] || '', s: tr};
      }
    }
    const data = Object.assign(list && items.length > 1 ? {p: {id: list, t: ptitle}, v: items} : {v: items}, {bv: 2});
    const z = new Uint8Array(await new Response(new Blob([JSON.stringify(data)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
    let bin = ''; for(let i = 0; i < z.length; i++) bin += String.fromCharCode(z[i]);
    const url = APP + '#addz=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const total = items.reduce((a, x) => a + (x.c ? x.c.length : 0), 0);
    const trn = items.reduce((a, x) => a + (x.tr ? x.tr.s.length : 0), 0);
    say('got ' + items.length + (items.length > 1 ? ' lectures' : ' video') + ' with ' + total + ' chapters' + (trn ? ' and the transcript (' + trn + ' lines)' : '') + '. Opening ChapterBox…');
    if(window.__chapterboxTest) return url;
    if(url.length > 16000){
      const tab = window.open(APP + '#recv', '_blank');
      if(tab){
        let sent = false;
        const onMsg = e => { if(e.source !== tab || !e.data || e.data.chapterbox !== 'ready') return; sent = true; window.removeEventListener('message', onMsg); tab.postMessage({chapterbox: 'addz', z: url.slice(url.indexOf('#addz=') + 6)}, new URL(APP).origin); setTimeout(() => box.remove(), 3000); };
        window.addEventListener('message', onMsg);
        setTimeout(() => { if(!sent){ window.removeEventListener('message', onMsg); try{ tab.location.href = url; }catch(e){ location.href = url; } } }, 20000);
        return;
      }
    }
    const w = window.open(url, '_blank'); if(!w) location.href = url;

  }catch(e){ say('something went wrong: ' + e.message); setTimeout(() => box.remove(), 8000); }
}

  if(playerState() === 2) player.playVideo();
}

// ================= actions =================
function openVideo(id){
  const v = store.videos.find(x => x.id === id); if(!v) return; planStop = null;
  store.currentId = id; v.opened = Date.now(); advancing = null; view = 'watch'; save(); render();
  const r = resumePoint(v);
  loadIntoPlayer(v, r.start, r.end, false);
}

function playChapter(i, autoplay = true, fromStart = false){
  const v = cur(); if(!v) return; planStop = null;
  const chs = chapters(v); if(i < 0 || i >= chs.length) return;
  const c = chs[i];
  const sameChapter = curChapter(v).idx === i;
  v.lastChapter = i;
  const start = (!fromStart && sameChapter && v.lastTime > c.start && (c.end == null || v.lastTime < c.end - 2)) ? v.lastTime : c.start;
  v.lastTime = start; heldAt = null; save();
  renderPlaylist(); renderNow();
  loadIntoPlayer(v, start, c.end, autoplay);
}

function markDone(v, key){ if(v.done[key]) return; v.done[key] = true; statDay().c++; afterDone(v, key); }
function toggleDone(i){
  const v = cur(); const c = chapters(v)[i]; if(!c) return;
  if(v.done[c.key]) delete v.done[c.key]; else markDone(v, c.key);
  save(); renderLibrary(); renderTitlebar(); renderPlaylist(); renderNow();
  const p = progressOf(v); if(p.done === p.total && v.done[c.key]) toast('🎉 Whole video finished! Nice work');
}
function toggleStar(i){
  const v = cur(); const c = chapters(v)[i]; if(!c) return;
  v.stars = v.stars || {};
  if(v.stars[c.key]) delete v.stars[c.key]; else v.stars[c.key] = true;
  save(); renderPlaylist(); renderNow(); toast(v.stars[c.key] ? '⭐ Added to your revise list' : 'Removed from your revise list');
}
function resetProgress(){
  const v = cur();
  confirmModal('Reset progress?', 'This clears all ✓ marks for this video. Your notes are kept.', 'Reset', () => {
    v.done = {}; v.reach = {}; v.lastChapter = 0; v.lastTime = 0; save(); render(); toast('Progress reset');
  });
}

async function exportBackup(){

    let added = 0, updated = 0;
    for(const v of data.videos){
      if(!v || !v.ytId) continue; v.done ||= {}; v.notes ||= {}; v.chapters ||= []; v.id ||= 'v' + Math.random().toString(36).slice(2);
      const i = store.videos.findIndex(x => x.id === v.id || x.ytId === v.ytId);

    for(const c of Array.isArray(data.courses) ? data.courses : []){ if(!c || !c.id || !Array.isArray(c.order)) continue; const i = store.courses.findIndex(x => x.id === c.id); if(i >= 0) store.courses[i] = c; else store.courses.push(c); }

const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function dayKey(d = new Date()){ return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function parseDay(k){ const [y, m, d] = String(k).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function fmtDay(d){ return d.toLocaleDateString('en-IN', {day: 'numeric', month: 'short'}); }
function fmtDur(sec){ sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m`; }
function statDay(){ const k = dayKey(); return store.stats[k] || (store.stats[k] = {s: 0, c: 0}); }
const ownerOf = v => courseOf(v) || v;
const ownerVideos = o => o.order ? courseVideos(o) : [o];
const ownerKey = o => (o.order ? 'c:' : 'v:') + o.id;
const findOwner = k => k.startsWith('c:') ? store.courses.find(c => c.id === k.slice(2)) : store.videos.find(v => v.id === k.slice(2));
function ownerProgress(o){ let d = 0, t = 0, left = 0; for(const v of ownerVideos(o)) for(const c of chapters(v)){ t++; if(v.done[c.key]) d++; else left += Math.max(0, chapterLen(v, c) - reachOf(v, c)); } return {done: d, total: t, left}; }
function continueTarget(o){

// ================= smart coach: how hard is each chapter? =================
// 1 = very easy … 5 = very hard. Your dot choice wins, then your 😀😐😵 rating, then the AI's rating,
// then clues: words in the title, length compared with the rest of the course, place in the course, ⭐ and rewatching.
const EASY_RE = /\b(intro(duction)?|basics?|overview|what is|getting started|set ?up|install(ation|ing)?|history|syllabus|welcome|recap|summary|revision|conclusion|outro|fundamentals?|definitions?|terminology|orientation)\b/i;
const HARD_RE = /\b(advanced?|pointers?|recursion|recursive|dynamic|dp|graphs?|trees?|proofs?|prove|derivations?|derive|theorems?|optimi[sz]\w*|complex(ity)?|tricky|hard|difficult|challenge|memory|bit ?manipulation|series|epsilon|matri(x|ces)|eigen\w*|differential|integration by parts|transforms?|laplace|fourier|algorithms?|linked lists?|stacks?|queues?|heaps?|hashing|backtracking|thevenin|norton|superposition|three[- ]phase|transients?|vectors? calculus|multivariable)\b/i;
const PRACTICE_RE = /\b(problems?|questions?|q\s?\d+|exercises?|practice|homework|hw|assignments?|examples?|numericals?|mcqs?|quiz|solve|solving|solutions?|pyqs?|tests?|worksheet)\b/i;
const DDOT = ['🟢', '🟡', '🔴'], DNAME = ['Easy', 'Medium', 'Hard'];
const DSRC = {you: 'set by you', rated: 'your rating', ai: 'rated by AI', auto: 'auto: title, length, place'};
const DLV = s => s < 2.3 ? 0 : s < 3.5 ? 1 : 2;
const plainPart = t => t === 'Whole video' || t === 'Full video' || /^Part \d+( of \d+)?$/.test(t);
function diffMap(o){
  const ok = ownerKey(o); if(diffCache.has(ok)) return diffCache.get(ok);
  const all = [];
  ownerVideos(o).forEach((v, li) => chapters(v).forEach(c => all.push({v, c, li, len: chapterLen(v, c) || 0})));
  const lens = all.map(x => x.len).filter(Boolean).sort((a, b) => a - b), med = lens.length ? lens[lens.length >> 1] : 0;
  const m = new Map();
  all.forEach((x, i) => {
    const {v, c} = x, key = c.key, set = (v.diffSet || {})[key], r = (v.rate || {})[key], ai = (v.aiDiff || {})[key];
    let s, src;
    if(set){ s = set; src = 'you'; }
    else if(r){ s = [0, 1.5, 3, 4.5][r]; src = 'rated'; }
    else if(ai){ s = ai; src = 'ai'; }
    else {
      const t = plainPart(c.title) ? v.title : c.title;
      s = 2.4; src = 'auto';
      if(EASY_RE.test(t)) s -= 1.1;
      if(HARD_RE.test(t)) s += 1.2;
      if(PRACTICE_RE.test(t)) s += 0.3;
      const num = t.match(/\b(?:problem|question|q|exercise|homework|hw|example)\s*#?\s*(\d+)/i); if(num) s += Math.min(0.6, +num[1] * 0.03);
      if(med && x.len) s += Math.max(-0.6, Math.min(0.8, 0.5 * Math.log2(x.len / med)));
      s += all.length > 1 ? 0.5 * i / (all.length - 1) - 0.25 : 0;
    }
    if(src === 'auto' || src === 'ai'){
      if((v.stars || {})[key]) s += 0.4;
      const w = (v.wt || {})[key]; if(w && x.len > 60 && w > 1.6 * x.len) s += 0.6;   // you rewatched it a lot
    }
    m.set(v.id + ':' + key, {s: Math.max(1, Math.min(5, s)), src});
  });
  diffCache.set(ok, m); return m;
}
function diffAt(v, key){ return diffMap(ownerOf(v)).get(v.id + ':' + key) || {s: 2.5, src: 'auto'}; }
function diffDot(v, c){ const d = diffAt(v, c.key), lv = DLV(d.s); return `<button class="dbtn" data-diff="${c.idx}" title="${DNAME[lv]} (${DSRC[d.src]}). Click to change">${DDOT[lv]}</button>`; }
function diffLabel(v, c){ const d = diffAt(v, c.key), lv = DLV(d.s); return `<span title="${DSRC[d.src]}">${DDOT[lv]} ${DNAME[lv]}</span>`; }
function cycleDiff(i){
  const v = cur(); const c = v && chapters(v)[i]; if(!c) return;
  v.diffSet = v.diffSet || {};
  const steps = [undefined, 1.5, 3, 4.5], next = steps[(steps.indexOf(v.diffSet[c.key]) + 1) % steps.length];
  if(next == null) delete v.diffSet[c.key]; else v.diffSet[c.key] = next;
  save(); renderPlaylist(); renderNow();
  toast(next == null ? '🧠 Back to automatic difficulty' : `Set to ${DDOT[DLV(next)]} ${DNAME[DLV(next)]}`);
}

// ================= smart order: easy → hard =================
const ORDERS = [['smart', '🧠 Smart: ideas first, then practice easy → hard'], ['easy', '🧗 Easy → hard (ignores lecture order)'], ['course', '📚 Course order']];
const orderOpts = sel => ORDERS.map(([v, l]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`).join('');
// a course "builds step by step" when most lecture titles are numbered (Lecture 3, Part 2, 1.4, Day 5…)
function sequential(o){
  const vids = ownerVideos(o); if(vids.length < 3) return true;
  const n = vids.filter(v => /\b(lecture|lec|part|chapter|ch|day|class|session|module|unit|episode|ep|video|lesson|week|l)\s*[-#.:]?\s*\d+|\b\d+\.\d+\b|^\s*\d+\s*[.:)\-]/i.test(v.title)).length;
  return n / vids.length >= 0.5;
}
function orderHint(o, mode){
  if(mode === 'easy') return 'Everything from easiest to hardest. Great for problem sets; risky when each lecture needs the one before it.';
  if(mode === 'course') return 'Exactly the order of the playlist.';
  return sequential(o) ? 'This course builds step by step, so lectures stay in order. Inside each lecture: ideas first, then practice problems from easy to hard.'
    : 'These lectures look independent, so the easier ones come first. Inside each: ideas first, then practice from easy to hard.';
}
function orderItems(o, items, mode){
  if(mode === 'course' || items.length < 2) return items;
  const pos = new Map(items.map((x, i) => [x, i])), sc = x => diffAt(x.v, x.c.key).s;
  const byDiff = (a, b) => sc(a) - sc(b) || pos.get(a) - pos.get(b);
  if(mode === 'easy') return [...items].sort(byDiff);
  const groups = [];
  for(const x of items){ const gr = groups[groups.length - 1]; if(gr && gr.li === x.li) gr.items.push(x); else groups.push({li: x.li, items: [x]}); }
  const avg = gr => gr.items.reduce((a, x) => a + sc(x), 0) / gr.items.length;
  const lectures = sequential(o) ? groups : [...groups].sort((a, b) => avg(a) - avg(b) || a.li - b.li);
  const prac = x => !plainPart(x.c.title) && PRACTICE_RE.test(x.c.title);
  return lectures.flatMap(gr => [...gr.items.filter(x => !prac(x)), ...gr.items.filter(prac).sort(byDiff)]);
}

// ================= after a chapter: rate it, review it later =================
const REV = {h: [1, 3, 7, 16, 35], m: [2, 7, 21]};   // days until each review: hard ones more often
const plusDays = n => dayKey(new Date(Date.now() + n * 864e5));
function reviewKind(v, key){
  const r = (v.rate || {})[key], star = !!(v.stars || {})[key];
  if(r === 3) return 'h'; if(r === 2) return 'm'; if(r === 1) return star ? 'm' : null;
  return star || DLV(diffAt(v, key).s) === 2 ? 'h' : null;
}
function schedule(v, key, kind){
  v.rev = v.rev || {};
  if(!kind || store.settings.revise === false){ delete v.rev[key]; return; }
  v.rev[key] = {k: kind, s: 0, due: plusDays(REV[kind][0])};
}
function afterDone(v, key){
  if(store.settings.revise !== false && !(v.rev || {})[key]) schedule(v, key, reviewKind(v, key));
  setTimeout(() => askRate(v, key), 0);
}
let rateT = null;
function askRate(v, key){
  if((v.rate || {})[key]) return;
  const c = chapters(v).find(x => String(x.key) === String(key)); if(!c) return;
  const b = $('#rateBar');
  b.innerHTML = `<span>How was <b>${esc(c.title.slice(0, 60))}</b>?</span><button class="small" data-r="1">😀 Easy</button><button class="small" data-r="2">😐 OK</button><button class="small" data-r="3">😵 Hard</button><button class="small" data-x="1" title="Skip">✕</button>`;
  b.hidden = false; clearTimeout(rateT); rateT = setTimeout(() => { b.hidden = true; }, 25000);
  b.querySelectorAll('[data-r]').forEach(x => x.onclick = () => { b.hidden = true; setRate(v, key, +x.dataset.r); });
  b.querySelector('[data-x]').onclick = () => { b.hidden = true; };
}
function setRate(v, key, r){
  v.rate = v.rate || {}; v.rate[key] = r; if(v.diffSet) delete v.diffSet[key];
  const rev = store.settings.revise !== false;
  if(v.done[key] && rev) schedule(v, key, reviewKind(v, key));
  save(); if(cur() === v && view === 'watch'){ renderPlaylist(); renderNow(); } else if(view === 'home') renderHome();
  toast(r === 3 ? `😵 Marked hard${rev && v.done[key] ? ". It'll come back for a quick review tomorrow" : ''}` : r === 2 ? `😐 Got it${rev && v.done[key] ? '. A quick review in 2 days' : ''}` : '😀 Nice, marked easy');
}
function dueReviews(){
  const k = dayKey(), out = [];
  for(const v of store.videos) for(const [key, r] of Object.entries(v.rev || {})){
    if(!r || r.due > k || !v.done[key]) continue;
    const c = chapters(v).find(x => String(x.key) === key); if(c) out.push({v, c, r});
  }
  return out.sort((a, b) => a.r.due.localeCompare(b.r.due) || diffAt(b.v, b.c.key).s - diffAt(a.v, a.c.key).s);
}
function reviewed(v, key, ok){
  const r = v.rev[key], iv = REV[r.k] || REV.h;
  r.last = dayKey();
  if(!ok){ r.s = 0; r.due = plusDays(1); return 'again'; }
  r.s++;
  if(r.s >= iv.length){ delete v.rev[key]; return 'done'; }
  r.due = plusDays(iv[r.s]); return iv[r.s];
}
function reviewSection(){
  const due = dueReviews(); if(!due.length) return '';
  return `<div class="sec-h" id="revSec"><h2>🔁 Review today (${due.length})</h2><span class="muted" style="font-size:12px">Read your notes or skim at 2×. Spaced reviews make it stick.</span></div>
    <div class="revbox">${due.slice(0, 12).map(({v, c}) => `<div class="rev-row"><span>${DDOT[DLV(diffAt(v, c.key).s)]}</span>
      <span class="t" data-sv="${v.id}" data-si="${c.idx}">${esc(c.title)} <span class="muted">· ${esc(ownerOf(v).title.slice(0, 40))}${c.len ? ' · ' + fmt(c.len) : ''}${v.notes[c.key] ? ' · 📝 notes' : ''}</span></span>
      <button class="small" data-rok="${esc(v.id)}|${esc(c.key)}" title="Remembered it. See it again later">✓ Remembered</button><button class="small" data-rno="${esc(v.id)}|${esc(c.key)}" title="Forgot some. See it again tomorrow">↺ Again</button></div>`).join('')}</div>`;

function bindReviews(el){
  el.querySelectorAll('[data-rok],[data-rno]').forEach(b => b.onclick = () => {
    const [vid, key] = (b.dataset.rok || b.dataset.rno).split('|'); const v = store.videos.find(x => x.id === vid);
    if(!v || !v.rev || !v.rev[key]) return;

function toggleRevise(){
  store.settings.revise = store.settings.revise === false;
  save(); render(); toast(store.settings.revise ? '🔁 Spaced review is on' : '🔁 Spaced review is off');

// ================= smart coach card =================
let coachActs = [];
function weekBySubject(){
  const tot = {};
  for(let i = 0; i < 7; i++){ const d = new Date(); d.setDate(d.getDate() - i); for(const [k, s] of Object.entries((store.stats[dayKey(d)] || {}).o || {})) tot[k] = (tot[k] || 0) + s; }
  const top = Object.entries(tot).filter(([k]) => findOwner(k)).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if(!top.length || top.reduce((a, x) => a + x[1], 0) < 600) return null;
  return 'This week: ' + top.map(([k, s]) => `<b>${esc(findOwner(k).title.slice(0, 32))}</b> ${fmtDur(s)}`).join(' · ');
}
const fmtHour = h => `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
function easiestNext(){
  let best = null;
  for(const v of store.videos){ const c = chapters(v).find(x => !v.done[x.key]); if(!c) continue; const s = diffAt(v, c.key).s; if(!best || s < best.s) best = {v, c, s}; }
  return best;
}
// the fewest minutes a day that still finishes by the target date (null if even 10 hours a day can't)
function minutesToFinish(o, p, target){
  const endOf = m => { const pl = computePlan(o, Object.assign({}, p, {mode: 'minutes', minutes: m})); return pl && pl.days.length ? dayKey(pl.days[pl.days.length - 1].date) : dayKey(); };
  if(endOf(600) > target) return null;
  let lo = 5, hi = 600;
  while(lo < hi){ const mid = (lo + hi) >> 1; if(endOf(mid) <= target) hi = mid; else lo = mid + 1; }
  return Math.min(600, Math.ceil(lo / 5) * 5);
}
function coachTips(){
  const tips = [], k = dayKey(), today = statDay(), offAll = !!gOffs()[k];
  const active = planOwners().filter(o => { const pr = ownerProgress(o); return pr.done < pr.total; });
  // 1. today's mission: everything planned for today, all subjects together; warm up with the easiest
  if(active.length && !offAll){
    const its = [];
    for(const o of active) if(!offKind(o, k)) for(const x of todayPlan(o)) if(!x.done) its.push(x);
    if(its.length){
      const f = todayFirsts()[0], secs = its.reduce((a, x) => a + x.len, 0), subj = new Set(its.map(x => ownerOf(x.v))).size;
      tips.push({icon: '🎯', html: `Today: <b>${its.length} part${its.length > 1 ? 's' : ''} · ${fmtDur(secs)}</b>${subj > 1 ? ` across ${subj} subjects` : ''}. Warm up with the easiest: <b>${esc(f.c.title)}</b> ${DDOT[DLV(diffAt(f.v, f.c.key).s)]}`,
        btns: [['▶ Start', () => { const x = nextPick(); if(x) goSlice(x.v, x.c.idx, x.from, x.to); }], ['⏱ Just 5 minutes', startFive]]});
    } else if(active.some(o => !offKind(o, k) && todayPlan(o).length)) tips.push({icon: '🎉', html: "Today's plan is done! Anything more is a bonus."});
  }
  // 2. how the slow start is going
  const slows = active.filter(o => slowOf(o.plan)).map(o => { const pl = computePlan(o); return pl && pl.days.length && pl.slow ? {o, pl} : null; }).filter(Boolean);
  if(slows.length) tips.push({icon: '📈', html: 'Slow start: ' + slows.map(({o, pl}) => `<b>${esc(o.title.length > 30 ? o.title.slice(0, 28) + '…' : o.title)}</b> ${fmtDur(pl.days[0].cap)} a day now${pl.full && pl.full > parseDay(k) ? ` → ${fmtDur(pl.budget)} from ${fmtDay(pl.full)}` : ''}`).join(' · ')});
  // 3. pace: behind or ahead of where each plan should be
  for(const o of active){
    const p = o.plan, pl = computePlan(o); if(!pl || !pl.days.length) continue;
    const end = dayKey(pl.days[pl.days.length - 1].date);
    // plans made before slow starts and cut videos: take today's result as the new baseline, no false alarm
    if(p.v !== 8){ p.v = 8; p.target = end; p.base = pl.budget; save(); continue; }
    if(p.mode === 'date'){
      if(!p.base){ p.base = pl.budget; save(); continue; }
      if(pl.budget > p.base * 1.25){
        const keep = Math.max(5, Math.round(p.base / 60)), alt = computePlan(o, Object.assign({}, p, {mode: 'minutes', minutes: keep}));
        const altEnd = alt && alt.days.length ? alt.days[alt.days.length - 1].date : null;
        tips.push({icon: '⚠️', html: `To finish <b>${esc(o.title)}</b> by ${fmtDay(parseDay(p.date))} you now need <b>${fmtDur(pl.budget)}</b> a day (you planned ${fmtDur(p.base)}).`,
          btns: [...(altEnd ? [[`📆 Move to ${fmtDay(altEnd)}`, () => { p.date = dayKey(altEnd); p.base = computePlan(o).budget; o.planToday = null; save(); render(); toast(`📆 Finish date moved to ${fmtDay(altEnd)}`); }]] : []),
            [`💪 Keep ${fmtDay(parseDay(p.date))}`, () => { p.base = pl.budget; save(); render(); }]]});
      }
      continue;
    }
    if(!p.target){ p.target = end; save(); continue; }
    const diff = Math.round((parseDay(end) - parseDay(p.target)) / 864e5);
    if(diff >= 1){
      const need = minutesToFinish(o, p, p.target), was = p.minutes;
      tips.push({icon: '⚠️', html: `<b>${esc(o.title)}</b> is ${diff} day${diff > 1 ? 's' : ''} behind: it now ends ${fmtDay(parseDay(end))} instead of ${fmtDay(parseDay(p.target))}.`,
        btns: [...(need && need > was ? [[`⚡ Catch up: ${need} min/day`, () => { p.minutes = need; o.planToday = null; save(); render(); toast(`⚡ ${need} min a day. Back on track for ${fmtDay(parseDay(p.target))}`); }]] : []),
          [`📆 OK, finish ${fmtDay(parseDay(end))}`, () => { p.target = end; save(); render(); }]]});
    } else if(diff <= -2) tips.push({icon: '🚀', html: `<b>${esc(o.title)}</b> is ${-diff} days ahead of plan. Nice!`});
  }
  // 4. reviews and flashcards due
  const due = dueReviews();
  if(due.length) tips.push({icon: '🔁', html: `${due.length} chapter${due.length > 1 ? 's' : ''} to review today (about ${fmtDur(due.reduce((a, x) => a + (x.c.len || 0), 0) / 2)} at 2×).`, btns: [['Show', () => { const s = $('#revSec'); if(s) s.scrollIntoView({behavior: 'smooth', block: 'start'}); }]]});
  const fc = dueCards();
  if(fc.length) tips.push({icon: '🃏', html: `${fc.length} flashcard${fc.length > 1 ? 's' : ''} to review (about ${Math.max(1, Math.round(fc.length * 10 / 60))} min).`, btns: [['▶ Review', () => reviewCards()]]});
  // 5. evening nudge when nothing is studied yet
  if(!offAll && today.s < 60 && new Date().getHours() >= 17 && nextPick()){
    const st = streak();
    tips.push({icon: '🔥', html: st ? `Keep your <b>${st}-day streak</b> alive. Just 5 minutes counts.` : 'Nothing studied yet today. Just 5 minutes is enough to start.', btns: [['⏱ Just 5 minutes', startFive]]});
  }
  // 6. no plans yet
  if(!planOwners().length && store.videos.length) tips.push({icon: '📅', html: 'No study plans yet. I can plan all your courses at once and start slowly.', btns: [['🤖 Plan everything', autoPlanModal]]});
  // 7. insights
  const wk = weekBySubject(); if(wk) tips.push({icon: '📊', html: wk});
  const hrs = store.hours || [], tot = hrs.reduce((a, b) => a + b, 0);
  if(tot >= 3 * 3600){ const h = hrs.indexOf(Math.max(...hrs)); tips.push({icon: '💡', html: `You study most around <b>${fmtHour(h)}</b>. A calendar reminder at that time helps.`, btns: [['🗓 Auto-schedule', calModal]]}); }
  // 8. auto-schedule and the calendar
  const cst = calSet(), gh = ghCfg();
  if(gh.err) tips.push({icon: '⚠️', html: `Your live calendar stopped updating: ${esc(gh.err)}.`, btns: [['Fix', calModal]]});
  if(!cst.on && planOwners().length && !store.settings.calHintOff) tips.push({icon: '🗓', html: 'New: I can schedule your study around your <b>Apple Calendar</b> and put the sessions in it.', btns: [['Set up', calModal], ['Hide', () => { store.settings.calHintOff = true; save(); render(); }]]});
  if(cst.on && calData.src.length && Math.max(...calData.src.map(s => s.at)) < Date.now() - 21 * 864e5) tips.push({icon: '🗓', html: 'Your calendar copy is over 3 weeks old. Export it again if your events changed.', btns: [['Update', calModal]]});
  // 9. optional real AI
  if(!aiReady() && store.videos.length && !store.settings.aiHintOff) tips.push({icon: '🤖', html: 'Want a real AI too? Add a free Gemini key to ask about any chapter, get quizzes, flashcards, translations and AI difficulty ratings.', btns: [['Set up', aiModal], ['Hide', () => { store.settings.aiHintOff = true; save(); render(); }]]});
  return tips;
}

let focus = null;
function focusMenu(e){
  e.stopPropagation();
  const items = focus ? [['⏹ Stop the timer', () => { focus = null; tickFocus(); toast('Timer stopped'); }]] : [];
  popMenu(e.currentTarget, items.concat([['🍅 Focus 25 min, then a 5 min break', () => startFocus(25, 5)], ['🍅 Focus 50 min, then a 10 min break', () => startFocus(50, 10)], ['🍅 Focus 90 min, then a 15 min break', () => startFocus(90, 15)]]));
}
function startFocus(f, b){ focus = {phase: 'focus', end: Date.now() + f * 6e4, f, b}; tickFocus(); toast(`🍅 ${f} minutes of focus. Phone away!`); }
function tickFocus(){
  const btn = $('#focusBtn'); if(!btn) return;
  if(!focus){ btn.textContent = '🍅'; btn.classList.remove('on'); btn.title = 'Focus timer (Pomodoro)'; return; }
  const left = Math.max(0, Math.ceil((focus.end - Date.now()) / 1000));
  btn.textContent = (focus.phase === 'focus' ? '🍅 ' : '☕ ') + fmt(left); btn.classList.add('on');
  btn.title = focus.phase === 'focus' ? 'Focus time. Click to stop' : 'Break. Click to stop';
  const bl = $('#brkLeft'); if(bl) bl.textContent = fmt(left);
  if(left > 0) return;
  if(focus.phase === 'focus'){
    const sd = statDay(); sd.f = (sd.f || 0) + 1; save();
    try{ if([1, 3].includes(playerState())) player.pauseVideo(); }catch(e){}
    focus = {phase: 'break', end: Date.now() + focus.b * 6e4, f: focus.f, b: focus.b};
    openModal(`<h2>☕ Break time!</h2><p>That's 🍅 ${sd.f} today. Stand up, drink some water and rest your eyes.</p>
      <p class="muted">The video is paused. Next focus session in <b id="brkLeft">${fmt(focus.b * 60)}</b>.</p>
      <div class="actions"><button id="brkStop">Stop timer</button><button class="primary" id="brkSkip">Skip break</button></div>`);
    $('#brkSkip').onclick = () => { closeModal(); if(focus) focus.end = Date.now(); tickFocus(); };
    $('#brkStop').onclick = () => { closeModal(); focus = null; tickFocus(); };
    if(view === 'home') renderHome();
  } else {
    focus = {phase: 'focus', end: Date.now() + focus.f * 6e4, f: focus.f, b: focus.b};
    if($('#brkLeft')) closeModal();
    toast('⏰ Break over. Next 🍅 started, press play!');
  }
  tickFocus();
}

const AIK = 'chapterbox.ai', AIBASE = 'https://generativelanguage.googleapis.com/v1beta';
function aiCfg(){ try{ return JSON.parse(localStorage.getItem(AIK)) || {}; }catch(e){ return {}; } }
function aiSet(c){ try{ if(c && c.key) localStorage.setItem(AIK, JSON.stringify(c)); else localStorage.removeItem(AIK); }catch(e){} }
const aiReady = () => !!aiCfg().key;
async function aiFetch(path, key, body){
  const r = await fetch(`${AIBASE}/${path}`, {method: body ? 'POST' : 'GET', headers: Object.assign({'x-goog-api-key': key}, body ? {'Content-Type': 'application/json'} : {}), body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(j.error && j.error.message ? String(j.error.message).split('\n')[0].slice(0, 200) : 'HTTP ' + r.status); e.status = r.status; throw e; }
  return j;
}
// model names change often, so ask Google which ones this key can use and take the newest Flash
async function aiModel(key){
  const j = await aiFetch('models?pageSize=200', key);
  const names = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => String(m.name).replace(/^models\//, ''));
  const score = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || 0) * 10 + (/flash/.test(n) ? 5 : 0) - (/lite|preview|exp|tts|image|live|thinking|audio|embed|8b|vision|learn|robotics|computer/.test(n) ? 20 : 0) - (/-\d{3}$/.test(n) ? 1 : 0);
  return names.filter(n => /^gemini-/.test(n) && /flash|pro/.test(n)).sort((a, b) => score(b) - score(a))[0] || 'gemini-2.5-flash';
}
async function askAI(prompt, json){
  const c = aiCfg(); if(!c.key) throw new Error('add your key first (⋯ → AI helper)');
  let model = c.model; if(!model){ model = await aiModel(c.key); aiSet({...c, model}); }
  const body = {contents: [{role: 'user', parts: [{text: prompt}]}], generationConfig: Object.assign({temperature: 0.4}, json ? {responseMimeType: 'application/json'} : {})};
  let j;
  try{ j = await aiFetch(`models/${model}:generateContent`, c.key, body); }
  catch(e){ if(e.status !== 404) throw e; model = await aiModel(c.key); aiSet({...c, model}); j = await aiFetch(`models/${model}:generateContent`, c.key, body); }   // that model was retired: pick a new one
  const text = ((((j.candidates || [])[0] || {}).content || {}).parts || []).map(p => p.text || '').join('').trim();
  if(!text) throw new Error('the AI sent an empty answer, try again');
  return text;
}
function parseAIJSON(s){
  s = String(s).trim().replace(/^```(?:json)?\s{0,}/i, '').replace(/\s{0,}```$/, '');
  try{ return JSON.parse(s); }catch(e){}
  const m = s.match(/[\[{][\s\S]*[\]}]/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  throw new Error("couldn't read the AI's answer, try again");
}

function aiContext(v, c){
  const o = courseOf(v), chs = chapters(v), prev = chs[c.idx - 1], next = chs[c.idx + 1];
  return `Course: ${o ? o.title : v.title}\nLecture: ${v.title}\n${plainPart(c.title) ? '' : `Chapter ${c.idx + 1} of ${chs.length}: ${c.title}\n`}${prev && !plainPart(prev.title) ? `Previous chapter: ${prev.title}\n` : ''}${next && !plainPart(next.title) ? `Next chapter: ${next.title}\n` : ''}${v.notes[c.key] ? `My notes:\n${v.notes[c.key].slice(0, 2500)}\n` : ''}`;
}
function mdLite(srcText){
  let html = '';
  String(srcText).split('```').forEach((part, i) => {
    if(i % 2){ html += `<pre><code>${esc(part.replace(/^[\w+-]*\n/, ''))}</code></pre>`; return; }
    let list = false;
    for(const raw of esc(part).split('\n')){
      const line = raw.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*{2}/g, '<b>$1</b>').replace(/^\s*#{1,4}\s*(.+)$/, '<b>$1</b>');
      const m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
      if(m){ if(!list){ html += '<ul>'; list = true; } html += `<li>${m[1]}</li>`; }
      else { if(list){ html += '</ul>'; list = false; } if(line.trim()) html += `<p>${line}</p>`; }
    }
    if(list) html += '</ul>';
  });
  return html;
}
function normQuiz(x){
  const list = Array.isArray(x) ? x : (x && (x.questions || x.quiz || Object.values(x).find(Array.isArray))) || [];

    let a = q.answer ?? q.correct ?? q.answerIndex;
    if(typeof a === 'string'){ const t = a.trim(); a = /^[A-Fa-f]$/.test(t) ? t.toUpperCase().charCodeAt(0) - 65 : /^\d+$/.test(t) ? +t : q.options.findIndex(op => String(op).trim().toLowerCase() === t.toLowerCase()); }
    return {q: String(q.q || q.question), options: q.options.map(String), answer: a >= 0 && a < q.options.length ? a : 0, why: String(q.why || q.explanation || '')};
  });
}

function trackReach(v, c, t){
  const off = t - c.start;
  if(!run || run.vid !== v.id || run.key !== c.key || Math.abs(off - run.last) > 3) run = {vid: v.id, key: c.key, start: off, last: off};
  run.last = off;
  v.reach = v.reach || {}; const r = v.reach[c.key] || 0;
  if(off > r && run.start <= r + 6) v.reach[c.key] = Math.round(off * 10) / 10;   // skipping ahead doesn't count as watched
}
function goSlice(v, idx, from, to){
  openVideo(v.id);
  const c = chapters(v)[idx]; if(!c) return;
  v.lastChapter = idx; v.lastTime = c.start + (from || 0); heldAt = null;
  playChapter(idx, true);
  const full = chapterLen(v, c);
  if(to != null && full && to < full - 5) planStop = {vid: v.id, at: c.start + to};
}
// the first unfinished part of today's plan in each subject, easiest first
function todayFirsts(){
  const k = dayKey(), out = [];
  if(gOffs()[k]) return out;
  for(const o of planOwners()){ if(offKind(o, k)) continue; const x = todayPlan(o).find(y => !y.done); if(x) out.push(x); }
  return out.sort((a, b) => diffAt(a.v, a.c.key).s - diffAt(b.v, b.c.key).s);
}
function nextPick(){
  const f = todayFirsts()[0];
  if(f) return {v: f.v, c: f.c, from: Math.max(f.from, Math.floor(reachOf(f.v, f.c))), to: f.part ? f.to : null};
  const v = cur();
  if(v){ const c = chapters(v)[resumeIdx(v)]; if(c && !v.done[c.key]) return {v, c, from: Math.floor(reachOf(v, c)), to: null}; }
  const e = easiestNext(); return e ? {v: e.v, c: e.c, from: Math.floor(reachOf(e.v, e.c)), to: null} : null;
}

    for(let i = 0; i < 2; i++){ const p = {}; for(const x of f.formatToParts(new Date(t))) p[x.type] = +x.value; t = wall - (Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute, p.second) - t); }

  }catch(e){ return null; }
}

  if(m[7]) return {ms: Date.UTC(y, mo, d, h, mi, s)};

  if(tz){ const ms = zonedMs(tz, y, mo, d, h, mi, s); if(ms != null) return {ms}; }

}

  const o = {}; for(const kv of String(v).split(';')){ const i = kv.indexOf('='); if(i > 0) o[kv.slice(0, i).toUpperCase()] = kv.slice(i + 1); }

function icsParse(text){

    if(!cur) continue;
    if(up === 'END:VEVENT'){ all.push(cur); cur = null; continue; }
    if(up.startsWith('BEGIN:')){ skip = 'END:' + up.slice(6); continue; }   // an alarm inside the event

    if(i >= raw.length) continue;

let tdbP = null, trIndex = null; const trCache = new Map();

}
async function trGet(id){

  const val = await trRead(id);
  if(!trCache.has(id)) trCache.set(id, val);   // something newer may have arrived meanwhile
  return trCache.get(id);
}
async function trPut(id, val){

}
async function trAll(){
  const m = new Map();
  try{ const db = await tdb(); await new Promise((res, rej) => { const q = db.transaction('tr').objectStore('tr').openCursor(); q.onsuccess = () => { const cu = q.result; if(cu){ m.set(cu.key, cu.value); cu.continue(); } else res(); }; q.onerror = () => rej(q.error); }); }catch(e){}

  for(const [k, x] of trCache) if(x && !m.has(k)) m.set(k, x);
  return m;
}
const LANGS = {hindi: 'hi', english: 'en', bengali: 'bn', bangla: 'bn', tamil: 'ta', telugu: 'te', marathi: 'mr', gujarati: 'gu', kannada: 'kn', malayalam: 'ml', punjabi: 'pa', urdu: 'ur', odia: 'or', nepali: 'ne', spanish: 'es', french: 'fr', german: 'de', arabic: 'ar', russian: 'ru', japanese: 'ja', korean: 'ko', chinese: 'zh', portuguese: 'pt', indonesian: 'id', italian: 'it', turkish: 'tr'};
function langCode(name){ const w = String(name || '').toLowerCase().match(/[a-z]+/); return (w && LANGS[w[0]]) || ''; }
function trSaveNew(v, tr){
  const s = (tr.s || []).filter(x => Array.isArray(x) && x[1]).map(([t, x]) => [Math.max(0, Math.round(+t || 0)), String(x).replace(/\s+/g, ' ').trim().slice(0, 2000)]).sort((a, b) => a[0] - b[0]);
  if(!s.length) return false;
  const sample = s.slice(0, 30).map(x => x[1]).join(' ');
  const code = langCode(tr.lang) || (/[\u0900-\u097F]/.test(sample) ? 'hi' : /[a-z]{3,}/i.test(sample) ? 'en' : '');
  const label = tr.lang || (code === 'hi' ? 'Hindi' : code === 'en' ? 'English' : 'Transcript');
  v.tr = {n: s.length, lang: label, code, en: code === 'en' ? s.length : 0};
  const rec = {lang: label, code, s, en: code === 'en' ? s.map(x => x[1]) : null, at: Date.now()}, before = trCache.get(v.ytId);
  trCache.set(v.ytId, rec); trIndex = null;
  // grabbing the same transcript again keeps its English translation
  (before !== undefined ? Promise.resolve(before) : trRead(v.ytId)).then(old => {
    if(!rec.en && old && old.en && old.s && old.s.length === s.length && old.s.every((x, i) => x[1] === s[i][1])){ rec.en = old.en; v.tr.en = rec.en.filter(Boolean).length; save(); }
    return trPut(v.ytId, rec);

}
// text copied from YouTube's transcript panel ("0:03" then the words), or an .srt / .vtt file
function parseTranscript(text){
  const out = []; let cur2 = null;
  for(const raw of String(text || '').replace(/\r/g, '').split('\n')){
    const l = raw.trim(); if(!l || /^WEBVTT/i.test(l)) continue;
    let m = l.match(/^((?:\d{1,2}:)?\d{1,2}:\d{2})(?:[.,]\d+)?\s*-->/);
    if(m){ cur2 = [toSec(m[1]), '']; out.push(cur2); continue; }
    if(/^\d+$/.test(l) && (!cur2 || cur2[1])) continue;
    m = l.match(/^((?:\d{1,2}:)?\d{1,2}:\d{2})(?:[.,]\d+)?$/);
    if(m){ cur2 = [toSec(m[1]), '']; out.push(cur2); continue; }
    m = l.match(/^((?:\d{1,2}:)?\d{1,2}:\d{2})\s+(.+)$/);
    if(m){ cur2 = [toSec(m[1]), m[2]]; out.push(cur2); continue; }
    if(cur2) cur2[1] = (cur2[1] ? cur2[1] + ' ' : '') + l.replace(/<[^>]+>/g, '');
  }
  return out.filter(x => x[1] && x[0] != null && !isNaN(x[0]));
}

async function trChunk(v, c, max = 30000){

  if(!rows.length) return '';
  let i0 = 0;
  if(rows.reduce((a, r) => a + r[1].length + 9, 0) > max){ const now = (playerTime() ?? c.start) - 300; i0 = Math.max(0, rows.findIndex(([t]) => t >= now)); }

  return `\nTranscript of this part (auto-generated captions, may have mistakes${tr.code !== 'en' && tr.en ? '; translated to English where available' : ''}). Use it as the main source:\n${txt}`;
}

    const part = rest.slice(i, i + 80);

    let arr = null;
    for(let tries = 0; tries < 4 && !arr; tries++){
      try{ arr = parseAIJSON(await askAI(`Translate each numbered line of this lecture transcript (${tr.lang || srcLang}) into simple, natural English. Keep technical words (like if, else, loop, variable, function) in English. Reply only with JSON: an array of exactly ${part.length} strings, one per line, in the same order.\n\n${part.map((n, j) => `${j + 1}. ${tr.s[n][1]}`).join('\n')}`, true)); }

}

// spaced repetition (a simple SM-2): good answers come back later and later, wrong ones tomorrow
function gradeCard(x, gr){
  if(gr === 1){ x.n = 0; x.iv = 1; x.ef = Math.max(1.3, x.ef - 0.2); }
  else if(gr === 2){ x.iv = Math.max(1, Math.round((x.iv || 1) * 1.2)); x.ef = Math.max(1.3, x.ef - 0.15); x.n++; }
  else if(gr === 3){ x.iv = x.n === 0 ? 1 : x.n === 1 ? 3 : Math.round(x.iv * x.ef); x.n++; }
  else { x.iv = x.n === 0 ? 3 : Math.round(Math.max(1, x.iv) * x.ef * 1.3); x.ef += 0.15; x.n++; }
  x.due = plusDays(x.iv); x.last = dayKey();
}

function normCards(x){

}

let sresults = [], ssel = 0;
function searchAll(q){

    if(v.title.toLowerCase().includes(q)) res.push({v, i: resumeIdx(v), label: '🎬 ' + v.title, where: o ? '📚 ' + o.title : 'Video'});
    for(const c of chapters(v)){
